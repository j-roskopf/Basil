app-id: com.joetr.basil
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: Basil

finish-args:
  - --share=ipc
  - --share=network
  # Compose Desktop still uses AWT on Linux; fallback-x11 hides the XWayland socket on
  # Wayland sessions, which makes the JVM start headless and exit immediately.
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --env=ALSA_PCM_NAME=pulse
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.secrets
  - --device=dri
  - --device=all
  - --filesystem=home
  - --filesystem=xdg-download

modules:
  - name: basil
    buildsystem: simple
    build-commands:
      - install -d /app/bin /app/lib/basil
      - cp -a basil/. /app/lib/basil/
      - ln -s /app/lib/basil/bin/Basil /app/bin/Basil
      - install -Dm644 com.joetr.basil.desktop /app/share/applications/com.joetr.basil.desktop
      - install -Dm644 com.joetr.basil.metainfo.xml /app/share/metainfo/com.joetr.basil.metainfo.xml
      - install -Dm644 com.joetr.basil.png /app/share/icons/hicolor/512x512/apps/com.joetr.basil.png
      - install -Dm644 com.joetr.basil.png /app/share/icons/hicolor/256x256/apps/com.joetr.basil.png
      - install -Dm644 com.joetr.basil.png /app/share/icons/hicolor/128x128/apps/com.joetr.basil.png
    sources:
      - type: dir
        path: ../build/compose/binaries/main-release/app/Basil
        dest: basil
      - type: file
        path: com.joetr.basil.desktop
      - type: file
        path: com.joetr.basil.metainfo.xml
      - type: file
        path: ../src/desktopMain/resources/icons/icon.png
        dest-filename: com.joetr.basil.png
