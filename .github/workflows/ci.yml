name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
      - name: Placeholder google-services.json
        run: |
          if [ ! -f androidApp/google-services.json ]; then
            printf '%s\n' '{
              "project_info": {"project_number":"0","project_id":"basil-test","storage_bucket":"basil-test.appspot.com"},
              "client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.joetr.basil"}},"oauth_client":[],"api_key":[{"current_key":"test"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],
              "configuration_version":"1"
            }' > androidApp/google-services.json
          fi
      - name: Build all targets
        env:
          FIREBASE_WEB_API_KEY: test-api-key
          FIREBASE_PROJECT_ID: basil-test
          BASIL_GOOGLE_WEB_CLIENT_ID: test-client-id.apps.googleusercontent.com
        run: ./gradlew build desktopTest verifyRoborazziDesktop wasmJsBrowserDistribution --no-daemon
      - name: Cloud Function tests
        working-directory: firebase/functions
        run: npm ci && npm test
      - name: Compile iOS framework
        env:
          FIREBASE_WEB_API_KEY: test-api-key
          FIREBASE_PROJECT_ID: basil-test
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --no-daemon
      - name: Build iOS app (simulator)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
