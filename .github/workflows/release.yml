name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    name: macOS / Android / Web
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Write google-services.json
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          cat > androidApp/google-services.json <<EOF
          {
            "project_info": {
              "project_number": "0",
              "project_id": "${FIREBASE_PROJECT_ID}",
              "storage_bucket": "${FIREBASE_STORAGE_BUCKET}"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:0:android:0",
                "android_client_info": {"package_name": "com.joetr.basil"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "${FIREBASE_WEB_API_KEY}"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          EOF
      - name: Import macOS signing certificate
        id: macos_identity
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_IDENTITY: ${{ secrets.MACOS_DEVELOPER_IDENTITY }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          missing=()
          [[ -n "${MACOS_CERTIFICATE_BASE64}" ]] || missing+=("MACOS_CERTIFICATE_BASE64")
          [[ -n "${MACOS_CERTIFICATE_PASSWORD}" ]] || missing+=("MACOS_CERTIFICATE_PASSWORD")
          [[ -n "${MACOS_DEVELOPER_IDENTITY}" ]] || missing+=("MACOS_DEVELOPER_IDENTITY")
          [[ -n "${MACOS_KEYCHAIN_PASSWORD}" ]] || missing+=("MACOS_KEYCHAIN_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required macOS release secrets: ${missing[*]}"
            exit 1
          fi

          cert_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/app-signing.keychain-db"
          echo "${MACOS_CERTIFICATE_BASE64}" | base64 --decode > "${cert_path}"

          security create-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${keychain_path}"
          security import "${cert_path}" -P "${MACOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${MACOS_KEYCHAIN_PASSWORD}" "${keychain_path}"

          jpackage_signing_identity="${MACOS_DEVELOPER_IDENTITY#Developer ID Application: }"
          jpackage_signing_identity="${jpackage_signing_identity#Developer ID Installer: }"
          identity_list="$(security find-identity -v "${keychain_path}")"
          if ! grep -Fq "Developer ID Application: ${jpackage_signing_identity}" <<< "${identity_list}"; then
            echo "::error::MACOS_CERTIFICATE_BASE64 must include the Developer ID Application identity named by MACOS_DEVELOPER_IDENTITY"
            exit 1
          fi

          {
            echo "compose.desktop.mac.sign=true"
            echo "compose.desktop.mac.signing.identity=${jpackage_signing_identity}"
            echo "compose.desktop.mac.signing.keychain=${keychain_path}"
          } >> "${HOME}/.gradle/gradle.properties"
      - name: Package Android and wasm artifacts
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_FUNCTIONS_REGION: ${{ secrets.FIREBASE_FUNCTIONS_REGION }}
          BASIL_GOOGLE_WEB_CLIENT_ID: ${{ secrets.BASIL_GOOGLE_WEB_CLIENT_ID }}
          BASIL_GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.BASIL_GOOGLE_WEB_CLIENT_SECRET }}
          RELEASE_STORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          fi
          ./gradlew :androidApp:bundleRelease :composeApp:wasmJsBrowserDistribution --no-daemon
      - name: Package signed macOS DMG
        run: ./gradlew :composeApp:packageReleaseDmg --no-daemon
      - name: Print macOS packaging logs
        if: failure()
        run: |
          log_dir="composeApp/build/compose/logs"
          if [[ -d "${log_dir}" ]]; then
            find "${log_dir}" -type f -name 'jpackage-*.txt' -print -exec sed -n '1,240p' {} \;
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          path: |
            composeApp/build/compose/binaries/main/dmg/*.dmg
            androidApp/build/outputs/bundle/release/*.aab
            composeApp/build/dist/wasmJs/productionExecutable/**

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Package Debian artifact
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_FUNCTIONS_REGION: ${{ secrets.FIREBASE_FUNCTIONS_REGION }}
          BASIL_GOOGLE_WEB_CLIENT_ID: ${{ secrets.BASIL_GOOGLE_WEB_CLIENT_ID }}
          BASIL_GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.BASIL_GOOGLE_WEB_CLIENT_SECRET }}
        run: ./gradlew :composeApp:packageDeb --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          if-no-files-found: error
          path: composeApp/build/compose/binaries/main/deb/*.deb

  windows:
    name: Windows (unsigned MSI)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Package unsigned Windows MSI
        shell: pwsh
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_FUNCTIONS_REGION: ${{ secrets.FIREBASE_FUNCTIONS_REGION }}
          BASIL_GOOGLE_WEB_CLIENT_ID: ${{ secrets.BASIL_GOOGLE_WEB_CLIENT_ID }}
          BASIL_GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.BASIL_GOOGLE_WEB_CLIENT_SECRET }}
        run: ./gradlew :composeApp:packageMsi --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: composeApp/build/compose/binaries/main/msi/*.msi

  release:
    name: Create GitHub release
    needs:
      - macos
      - linux
      - windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
