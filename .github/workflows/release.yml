name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    name: macOS / Android / Web
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Package macOS, Android, and wasm artifacts
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_FUNCTIONS_REGION: ${{ secrets.FIREBASE_FUNCTIONS_REGION }}
          BASIL_GOOGLE_WEB_CLIENT_ID: ${{ secrets.BASIL_GOOGLE_WEB_CLIENT_ID }}
          BASIL_GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.BASIL_GOOGLE_WEB_CLIENT_SECRET }}
          RELEASE_STORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          fi
          ./gradlew :composeApp:packageDmg :androidApp:bundleRelease :composeApp:wasmJsBrowserDistribution --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          path: |
            composeApp/build/compose/binaries/main/dmg/*.dmg
            androidApp/build/outputs/bundle/release/*.aab
            composeApp/build/dist/wasmJs/productionExecutable/**

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Package Debian artifact
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_FUNCTIONS_REGION: ${{ secrets.FIREBASE_FUNCTIONS_REGION }}
          BASIL_GOOGLE_WEB_CLIENT_ID: ${{ secrets.BASIL_GOOGLE_WEB_CLIENT_ID }}
          BASIL_GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.BASIL_GOOGLE_WEB_CLIENT_SECRET }}
        run: ./gradlew :composeApp:packageDeb --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          if-no-files-found: error
          path: composeApp/build/compose/binaries/main/deb/*.deb

  windows:
    name: Windows (unsigned MSI)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Package unsigned Windows MSI
        shell: pwsh
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_FUNCTIONS_REGION: ${{ secrets.FIREBASE_FUNCTIONS_REGION }}
          BASIL_GOOGLE_WEB_CLIENT_ID: ${{ secrets.BASIL_GOOGLE_WEB_CLIENT_ID }}
          BASIL_GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.BASIL_GOOGLE_WEB_CLIENT_SECRET }}
        run: ./gradlew :composeApp:packageMsi --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: composeApp/build/compose/binaries/main/msi/*.msi

  release:
    name: Create GitHub release
    needs:
      - macos
      - linux
      - windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
