<script type="application/ld+json">{"@context":"http://schema.org","@type":"Recipe","articleBody":"Everybody has a banana bread recipe—but we wanted one that truly stood out. So the Epicurious Test Kitchen baked and analyzed several of the highest-rated loaves in our archives, borrowing the best elements from each to create a version that’s tender, richly flavored, and reliably foolproof.\nSour cream gives the crumb subtle tang and structure, while plenty of very ripe bananas deliver concentrated flavor. The batter will nearly fill a standard 9x5\" loaf pan—that’s what gives this quick bread its generous height—so bake until a tester inserted in the center comes out clean or with a few moist crumbs. Let the loaf cool completely before slicing for the best texture.\nToasted walnuts add crunch and balance, but the loaf is just as good without them. Simple, classic, and dependable, this is the banana bread you’ll come back to whenever those bananas on your counter start to look a little too freckled.\nTips for making the best banana bread\nHow ripe should bananas be?\nThe peel should be fully speckled and nearly all brown—or even black. The riper the fruit, the sweeter and more flavorful your bread will be. In the Test Kitchen, we let bananas ripen until nearly fermented (they’ll smell almost boozy). Roasting or microwaving a yellow banana can work in a pinch, but the banana flavor won’t be as pronounced as a loaf made with truly ripe fruit.\nWhy is my banana bread dense or gummy?\nThe most likely causes of overly moist banana bread are using too much banana or underbaking. For the best texture, weigh your bananas; you want 13 oz. (369 g) of unpeeled ripe banana. Make sure to bake until the center of the loaf is fully set (an instant-read thermometer should read between 205°F and 210°F). Cooling completely before slicing also helps the crumb firm up.\nCan I substitute yogurt for sour cream?\nYes. Full-fat Greek yogurt makes a good all-purpose sour cream substitute and helps maintain the loaf’s texture.\nCan I reduce the sugar?\nMany readers who say they prefer a less-sweet banana bread report reducing the brown sugar to ¾ cup (packed; 150 g)—some use even less—with success. Upon retesting the recipe in February 2026, we still recommend a full cup for the most flavorful, moist loaf.\nCan I add chocolate, spices, or skip the nuts?\nSkip the walnuts for a nut-free loaf, or swap them for toasted pecans, pistachios, or hazelnuts. Fold in ½ cup chopped chocolate (or try our favorite chocolate chip banana bread variation). If you like a more dynamic banana bread, whisk up to 1 tsp. cinnamon or cardamom or ¼ tsp. nutmeg or cloves into the dry ingredients.","alternativeHeadline":"Make moist, tender banana bread with ripe bananas and simple ingredients. This easy, classic banana bread recipe delivers perfect texture every time.","keywords":["breakfast","bread","banana","walnut","brunch","vegetarian","make ahead","baking","electric mixer","epicurious","kid-friendly","paywall exclude","web"],"thumbnailUrl":"https://assets.epicurious.com/photos/698672614ff847d5c6bd6800/2:3/w_1515,h_2272,c_limit/banana-bread_RECIPE_V2_020526_4379_VOG_final.jpg","publisher":{"@context":"https://schema.org","@type":"Organization","name":"Epicurious","logo":{"@type":"ImageObject","url":"https://www.epicurious.com/verso/static/epicurious-us/assets/logo-seo.png","width":"488px","height":"100px"},"url":"https://www.epicurious.com"},"isPartOf":{"@type":"CreativeWork","name":"Epicurious"},"isAccessibleForFree":true,"author":[{"@type":"Person","name":"Rhoda Boone","sameAs":"https://www.epicurious.com/contributor/rhoda-boone"}],"aggregateRating":{"@type":"AggregateRating","ratingValue":4.5,"ratingCount":150},"description":"Make moist, tender banana bread with ripe bananas and simple ingredients. This easy, classic banana bread recipe delivers perfect texture every time.","image":["https://assets.epicurious.com/photos/698672614ff847d5c6bd6800/16:9/w_4802,h_2701,c_limit/banana-bread_RECIPE_V2_020526_4379_VOG_final.jpg","https://assets.epicurious.com/photos/698672614ff847d5c6bd6800/4:3/w_3247,h_2435,c_limit/banana-bread_RECIPE_V2_020526_4379_VOG_final.jpg","https://assets.epicurious.com/photos/698672614ff847d5c6bd6800/1:1/w_2400,h_2400,c_limit/banana-bread_RECIPE_V2_020526_4379_VOG_final.jpg"],"inLanguage":"en-US","headline":"Easy Classic Banana Bread","name":"Easy Classic Banana Bread","cookTime":"35 minutes","recipeIngredient":["Nonstick vegetable oil spray (for pan)","½ cup raw walnuts","3 medium very ripe bananas (about 13 oz.), peeled, flesh mashed","¼ cup sour cream","1 tsp. vanilla extract","1⅔ cups (208 g) all-purpose flour","1 tsp. baking powder","½ tsp. baking soda","½ tsp. Diamond Crystal or ¼ tsp. Morton kosher salt","1 cup (packed; 200 g) dark brown sugar","½ cup (1 stick) unsalted butter, room temperature","2 large eggs, room temperature"],"recipeInstructions":[{"@type":"HowToStep","text":"Preheat oven to 350°. Lightly coat a 9x5\" loaf pan with nonstick vegetable oil spray. Line with parchment paper, leaving overhang on long sides. Toast walnuts in a single layer on a small rimmed baking sheet, tossing halfway through, until golden brown, 8–10 minutes. Let cool, then chop and set aside."},{"@type":"HowToStep","text":"Combine 3 medium very ripe bananas (about 13 oz.), peeled, flesh mashed, ¼ cup sour cream, and 1 tsp. vanilla extract in a medium bowl. Sift 1⅔ cups (208 g) all-purpose flour, 1 tsp. baking powder, ½ tsp. baking soda, and ½ tsp. Diamond Crystal or ¼ tsp. Morton kosher salt into a large bowl."},{"@type":"HowToStep","text":"Using an electric mixer on medium speed, beat 1 cup (packed; 200 g) dark brown sugar and ½ cup (1 stick) unsalted butter, room temperature, in another large bowl until light and fluffy, 3–4 minutes. Add 2 large eggs, room temperature, one at a time, beating until combined after each addition, about 2 minutes total. Add banana mixture and beat until just combined, about 30 seconds. Reduce speed to low and add dry ingredients in 2 batches, beating until combined after each addition and scraping down sides of bowl with a rubber spatula as needed. Fold in reserved walnuts. Scrape batter into prepared pan and smooth surface. Lightly coat a paring knife with nonstick spray and run through center of batter to make a cut about ½\" deep. (This will create a weak spot where the bread will split while baking.)"},{"@type":"HowToStep","text":"Bake banana bread, rotating pan front to back halfway through, until a tester inserted into the center comes out clean, sides are starting to pull away from pan, and top is dark golden brown and starting to crack, 60–65 minutes. Transfer pan to a wire rack and let bread cool in pan at least 15 minutes. Run a butter knife or small offset spatula around edges of pan to loosen bread. Using parchment paper, lift loaf out of pan and transfer to a cutting board or plate and let cool completely before slicing.\nDo Ahead: Banana bread can be baked 3 days ahead. Store airtight at room temperature, or transfer to a resealable freezer bag and freeze up to 3 months.\nEditor’s note: This recipe was first printed online in March 2015 as “Our Favorite Banana Bread”; it has been updated for style. Head this way for more of our best banana recipes →"}],"totalTime":"1 hour 20 minutes (plus cooling) ","recipeYield":"Makes one 9x5\" loaf (8–10 servings)","url":"https://www.epicurious.com/recipes/food/views/easy-banana-bread-recipe","dateModified":"2026-02-19T13:03:55.436-05:00","datePublished":"2015-03-24T00:00:00.000-04:00"}</script>
