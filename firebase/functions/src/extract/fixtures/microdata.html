<!DOCTYPE html>

<body>
  <article itemscope itemtype="https://schema.org/Recipe">
    <h1 itemprop="name">Cacio e Pepe</h1>
    <p itemprop="description">Roman pasta with pecorino and black pepper.</p>
    <ul>
      <li itemprop="recipeIngredient">400g spaghetti</li>
      <li itemprop="recipeIngredient">200g Pecorino Romano, grated</li>
      <li itemprop="recipeIngredient">2 tsp freshly cracked black pepper</li>
    </ul>
    <ol>
      <li itemprop="recipeInstructions">Cook pasta in salted boiling water 8 minutes.</li>
      <li itemprop="recipeInstructions">Toast pepper in a dry pan 1 minute.</li>
      <li itemprop="recipeInstructions">Toss pasta with cheese and pepper off heat.</li>
    </ol>
  </article>
</body>
</html>
