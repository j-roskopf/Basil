<script type="application/ld+json" data-next-head="">{"@context":"https://schema.org","@id":"urn:nyt:ScoopRecipe:570b6a0917fe5f49a448e5a13b9454c1","@type":"Recipe","aggregateRating":{"@type":"AggregateRating","ratingCount":20446,"ratingValue":5},"alternateName":"Chocolate Chip Cookies","author":{"@id":"nyt://person/07566d9b-eef7-50ad-b461-613c924cad75","@type":"Person","name":"David Leite"},"cookingMethod":"Bake","copyrightHolder":{"@id":"https://cooking.nytimes.com/#publisher","@type":"Organization","name":"NYT Cooking"},"copyrightYear":2008,"dateModified":"2025-12-29T00:00:00Z","datePublished":"2008-07-09T00:00:00Z","description":"You may have memorized the foolproof gem on the back of the Toll House bag, given to the world by Ruth Graves Wakefield in the 1930s. But this may become your new favorite chocolate chip cookie recipe. It’s a little more complicated, and you’ll have to plan ahead: After assembling the dough, you must chill it for at least 24 hours before baking it, and preferably up to 36. This allows the dry ingredients time to soak up the wet ones, which results in a firmer dough. It leads to a marvelously chewy, chocolate-rich cookie. Don’t skimp on good chocolate, and the sea salt is not an option — it’s the beacon at the top of this gorgeous treat. (You can certainly put this recipe together by hand, but a stand mixer makes it easy work. If you’re in the market for one, our colleagues at The Wirecutter have tested quite a few, and they've put together an excellent guide to the best.) David Leite","image":[{"@id":"nyt://image/221a2f19-e3c7-5ea0-bfcb-67910aba12fe#videoSixteenByNineJumbo1600","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2022/02/12/dining/JT-Chocolate-Chip-Cookies/JT-Chocolate-Chip-Cookies-videoSixteenByNineJumbo1600.jpg","creditText":"Ryan Liebe for The New York Times. Food Stylist: Barrett Washburne.","dateModified":"2025-06-04T12:04:35.308Z","datePublished":"2022-02-12T17:49:09.000Z","height":"900","uploadDate":"2022-02-12T17:49:09.000Z","url":"https://static01.nyt.com/images/2022/02/12/dining/JT-Chocolate-Chip-Cookies/JT-Chocolate-Chip-Cookies-videoSixteenByNineJumbo1600.jpg","width":"1600"},{"@id":"nyt://image/221a2f19-e3c7-5ea0-bfcb-67910aba12fe#googleFourByThree","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2022/02/12/dining/JT-Chocolate-Chip-Cookies/JT-Chocolate-Chip-Cookies-googleFourByThree-v2.jpg","creditText":"Ryan Liebe for The New York Times. Food Stylist: Barrett Washburne.","dateModified":"2025-06-04T12:04:35.308Z","datePublished":"2022-02-12T17:49:09.000Z","height":"600","uploadDate":"2022-02-12T17:49:09.000Z","url":"https://static01.nyt.com/images/2022/02/12/dining/JT-Chocolate-Chip-Cookies/JT-Chocolate-Chip-Cookies-googleFourByThree-v2.jpg","width":"800"},{"@id":"nyt://image/221a2f19-e3c7-5ea0-bfcb-67910aba12fe#mediumSquareAt3X","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2022/02/12/dining/JT-Chocolate-Chip-Cookies/JT-Chocolate-Chip-Cookies-mediumSquareAt3X.jpg","creditText":"Ryan Liebe for The New York Times. Food Stylist: Barrett Washburne.","dateModified":"2025-06-04T12:04:35.308Z","datePublished":"2022-02-12T17:49:09.000Z","height":"1800","uploadDate":"2022-02-12T17:49:09.000Z","url":"https://static01.nyt.com/images/2022/02/12/dining/JT-Chocolate-Chip-Cookies/JT-Chocolate-Chip-Cookies-mediumSquareAt3X.jpg","width":"1800"},{"@id":"nyt://image/221a2f19-e3c7-5ea0-bfcb-67910aba12fe#facebookJumbo","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2022/02/12/dining/JT-Chocolate-Chip-Cookies/JT-Chocolate-Chip-Cookies-facebookJumbo.jpg","creditText":"Ryan Liebe for The New York Times. Food Stylist: Barrett Washburne.","dateModified":"2025-06-04T12:04:35.308Z","datePublished":"2022-02-12T17:49:09.000Z","height":"550","uploadDate":"2022-02-12T17:49:09.000Z","url":"https://static01.nyt.com/images/2022/02/12/dining/JT-Chocolate-Chip-Cookies/JT-Chocolate-Chip-Cookies-facebookJumbo.jpg","width":"1050"}],"isAccessibleForFree":false,"keywords":"Bittersweet Chocolate, Bread Flour, Cake Flour, Freezer Friendly, Plan-Ahead, Thanksgiving","mainEntityOfPage":{"@id":"//cooking.nytimes.com/recipes/1015819-chocolate-chip-cookies","@type":"WebPage","name":"Best Chocolate Chip Cookies"},"name":"Best Chocolate Chip Cookies","nutrition":{"@type":"NutritionInformation","calories":"399.22222222222223","carbohydrateContent":"66.6 grams","cholesterolContent":"54.4 milligrams","fatContent":"17.9 grams","fiberContent":"12.2 grams","proteinContent":"9.7 grams","saturatedFatContent":"10.7 grams","sodiumContent":"253.6 milligrams","sugarContent":"28.6 grams","unsaturatedFatContent":"0.9 grams"},"publisher":{"@id":"https://cooking.nytimes.com/#publisher","@type":"Organization","name":"NYT Cooking"},"recipeCategory":"Chocolate Chip Cookie, Dessert","recipeIngredient":["2 cups minus 2 tablespoons cake flour (8 ½ ounces)","1 ⅔ cups bread flour (8 ½ ounces)","1 ¼ teaspoons baking soda","1 ½ teaspoons baking powder","1 ½ teaspoons coarse sea salt, plus more for sprinkling","1 ¼ cups unsalted butter (2 ½ sticks)","1 ¼ cups light brown sugar (10 ounces)","1 cup plus 2 tablespoons granulated sugar (8 ounces)","2 large eggs","2 teaspoons natural vanilla extract","1 ¼ pounds bittersweet chocolate disks or fèves, at least 60 percent cacao content (see note)"],"recipeInstructions":[{"@type":"HowToStep","text":"Sift flours, baking soda, baking powder and salt into a bowl. Set aside.","url":"https://cooking.nytimes.com/recipes/1015819-chocolate-chip-cookies#recipe-step-1"},{"@type":"HowToStep","text":"Using a mixer fitted with paddle attachment, cream butter and sugars together until very light, about 5 minutes. Add eggs, one at a time, mixing well after each addition. Stir in the vanilla. Reduce speed to low, add dry ingredients and mix until just combined, 5 to 10 seconds. Drop chocolate pieces in and incorporate them without breaking them. Press plastic wrap against dough and refrigerate for 24 to 36 hours. Dough may be used in batches, and can be refrigerated for up to 72 hours.","url":"https://cooking.nytimes.com/recipes/1015819-chocolate-chip-cookies#recipe-step-2"},{"@type":"HowToStep","text":"When ready to bake, preheat oven to 350 degrees. Line a baking sheet with parchment paper or a nonstick baking mat. Set aside.","url":"https://cooking.nytimes.com/recipes/1015819-chocolate-chip-cookies#recipe-step-3"},{"@type":"HowToStep","text":"Scoop 6 3 ½-ounce mounds of dough (the size of generous golf balls) onto baking sheet, making sure to turn horizontally any chocolate pieces that are poking up; it will make for a more attractive cookie. Sprinkle lightly with salt and bake until golden brown but still soft, 18 to 20 minutes. Transfer sheet to a wire rack for 10 minutes, then slip cookies onto another rack to cool a bit more. Repeat with remaining dough, or reserve dough, refrigerated, for baking remaining batches the next day. Eat warm, with a big napkin.","url":"https://cooking.nytimes.com/recipes/1015819-chocolate-chip-cookies#recipe-step-4"}],"recipeYield":"18 5-inch cookies","review":[{"@type":"Review","author":{"@type":"Person","name":"YH"},"datePublished":"2026-08-01T19:01:16Z","reviewBody":"2 cups minus 2 tablespoons isn't the same as 1 2/3 cups, but somehow they have the same weights"},{"@type":"Review","author":{"@type":"Person","name":"Lauren Kerr"},"datePublished":"2026-07-27T20:06:20Z","reviewBody":"Super annoying that the actual recipe differs in one important way from the video: Scoop those dough balls BEFORE you chill/rest the dough."},{"@type":"Review","author":{"@type":"Person","name":"CGirl"},"datePublished":"2026-07-26T20:31:56Z","reviewBody":"Great instructions to make a very good chocolate chip cookie.  I'm not a fan of the 'salted' chocolate, but it was very good in this recipe.  I let the dough rest in the fridge overnight.  It was very hard to scoop.  I read a comment after that recommended you scoop the cookies first and then let it rest in the fridge.  Good suggestion.  I will probably add some nuts next time."},{"@type":"Review","author":{"@type":"Person","name":"Tilda"},"datePublished":"2026-07-25T17:59:00Z","reviewBody":"Do you have to wait 24 hours?"},{"@type":"Review","author":{"@type":"Person","name":"Piper"},"datePublished":"2026-07-24T11:37:11Z","reviewBody":"I've made this recipe many times and it works better with less butter. The cookies will hold their shape and not melt all over the baking sheet. I've tweaked the measurements:\n\n480 grams flour \n1 teaspoons baking soda\n 1 ½ teaspoons baking powder \n1 teaspoon coarse salt \n250 grams unsalted butter \n490 grams light brown sugar  (or a mix of sugars)\n2 large eggs \n2 teaspoons natural vanilla extract\n 200 grams bittersweet chocolate\nSea salt\n\nMakes 5 dozen cookies with a small ice cream scooper"},{"@type":"Review","author":{"@type":"Person","name":"rm"},"datePublished":"2026-07-24T03:04:45Z","reviewBody":"this is MY ☺️ cc cookie recipe and everyone thinks i’m a cc cookie genius! you can be too!"},{"@type":"Review","author":{"@type":"Person","name":"KS"},"datePublished":"2026-07-23T07:54:10Z","reviewBody":"Look they are very very good chocolate chip cookies. Sometimes there’s not more to it than that"},{"@type":"Review","author":{"@type":"Person","name":"Russ Gray"},"datePublished":"2026-07-22T10:31:34Z","reviewBody":"Who comes up with this stuff?\n\nYou don't need two different types of flour. You don't need course grain sea salt (which DOES NOT SIFT by the way).\n\nYou don't need 1.5 lbs of fancy chocolate pieces.\n\nOnce again, a NY Times recipe is overly complicated, misses key steps, and is not very good."},{"@type":"Review","author":{"@type":"Person","name":"gobadgers"},"datePublished":"2026-07-17T20:23:19Z","reviewBody":"Best brown butter cookie I've tried! I replaced some of the chocolate chips/chunks with some crushed SKOL candies to play off the brown butter, turned out perfect."},{"@type":"Review","author":{"@type":"Person","name":"Hopeful"},"datePublished":"2026-07-07T18:15:27Z","reviewBody":"I followed the recipe exactly as written. The cookies turned out dry, crumbly, almost grainy. Like, awful. \n\nSuch a disappointment, not to mention a huge waste of ingredients and time. \n\nNYT Cooking, it seems like this is not an uncommon result of this recipe.  Can you help?"},{"@type":"Review","author":{"@type":"Person","name":"santamonica"},"datePublished":"2026-07-03T03:04:01Z","reviewBody":"You can even bake a single cookie if you have a countertop toaster oven! I freeze the dough individually wrapped in parchment paper and then bust one out into the toaster oven when someone has a late night cookie craving, it’s perfect."},{"@type":"Review","author":{"@type":"Person","name":"Carrie R"},"datePublished":"2026-06-29T02:06:25Z","reviewBody":"These are so, so good. Buy the flours called for. You'll make these again."},{"@type":"Review","author":{"@type":"Person","name":"tracy"},"datePublished":"2026-06-27T15:23:59Z","reviewBody":"I added 1/8 tsp almond extract for a subtle nod to NYC diner chocolate chip cookies"},{"@type":"Review","author":{"@type":"Person","name":"Christine N"},"datePublished":"2026-06-22T13:18:50Z","reviewBody":"I don't think I've ever had such praise for an item I brought to a party! People were literally leaving the party with a few hidden away in a napkin!\nI used all AP flour, dark brown instead of light brown sugar. Chocolate chunks from the bag and chopped a dark chocolate sea salt chocolate bar I had.  Also which I think was one key, it sat for 48 hours before I baked them.  Also, flaky salt on top - a must!\nThis will definitely be my go to from now on!"},{"@type":"Review","author":{"@type":"Person","name":"santamonica"},"datePublished":"2026-07-03T03:06:56Z","reviewBody":"@Dawn Suggest watching the 2-min NYT Cooking video which scoops the dough BEFORE refrigeration (that video deviates from the written recipe in several ways and is immensely helpful)."},{"@type":"Review","author":{"@type":"Person","name":"Hopeful"},"datePublished":"2026-07-04T15:50:15Z","reviewBody":"@santamonica, thank you for this suggestion!  I wouldn’t have watched the video otherwise, but so glad I did!"},{"@type":"Review","author":{"@type":"Person","name":"Dawn"},"datePublished":"2026-06-21T21:01:25Z","reviewBody":"Refrigerated for more than 36 hours only to find the dough was so hard I could not even scoop it out!  Gotta let it warm up, then hope it will work.  Pretty disappointed."},{"@type":"Review","author":{"@type":"Person","name":"William Wroblicka"},"datePublished":"2015-10-31T15:05:07Z","reviewBody":"I think this recipe is unnecessarily fussy. The difference between the two kinds of flours is their protein content -- bread flour has 12.7% (per King Arthur Flour's website), cake flour has 9.4%, and all-purpose flour has 11.7%. The amounts of flour called for in the recipe are equal by weight, so the protein content of the combined bread and cake flours is 11.05%, which is practically the same as all-purpose flour. So I just used plain, old AP flour and the cookies turned out fine."},{"@type":"Review","author":{"@type":"Person","name":"Emma"},"datePublished":"2016-05-01T12:54:56Z","reviewBody":"Metric Measurements<br/><br/>241 grams / cake flour<br/>241 grams / bread flour<br/>1 ¼ teaspoons baking soda<br/>1 ½ teaspoons baking powder<br/>1 ½ teaspoons coarse salt<br/>284 grams / unsalted butter<br/>284 grams / light brown sugar<br/>227 grams / granulated sugar<br/>2 large eggs<br/>2 teaspoons natural vanilla extract<br/>680 grams / bittersweet chocolate disks (at least 60%)<br/>Sea salt"},{"@type":"Review","author":{"@type":"Person","name":"Cwarriner"},"datePublished":"2016-08-20T12:51:39Z","reviewBody":"I learned a trick from Cooks Illustrsted that I have used for several recipes, including CC cookies. Use cold butter. Place about 2/3 of butter in a skillet, melt and then lightly brown the butter. Pour browned butter over cold butter in mixing bowl and mix until cold butter is melted. Mix in sugars (1/2 Lt brown and 1/2 Dk brown), salt, eggs and vanilla. Mix thoroughly, then allow to sit for 3 minutes. Mix 30 seconds, then repeat twice. Then continue with recipe. Sugars develop beautifully!"},{"@type":"Review","author":{"@type":"Person","name":"Pam"},"datePublished":"2015-09-12T13:13:05Z","reviewBody":"I LOVE this recipe!  It is true that people absolutely go crazy for these cookies!  I have adapted the recipe over the years, including pre-scooping the cookies onto a wax paper-lined cookie sheet and refrigerating them prior to baking.  I find it much easier to do it this way than trying to scoop cold dough.  I bake what I want and put the rest in a zip-lock bag to bake later.  These cookies are the best the day you bake them.  I agree with Jenny W, you will be making them again, and again!"},{"@type":"Review","author":{"@type":"Person","name":"Eileen Fry"},"datePublished":"2016-05-10T12:16:39Z","reviewBody":"I'm not a big fan of CC cookies, but now I know it's because I have not had the best. OMG! This is THE only recipe you'll ever need. It is chewy and crisp on the outside. I used all purpose flour as the others suggested. I immediately baked the dough since I wanted to taste the difference. It was great! However, the longer the dough rested in the fridge the better it tasted. I baked it at 6 hours, 24 & 48 hours. Let me tell ya, it tasted the best after it has rested for 48."},{"@type":"Review","author":{"@type":"Person","name":"Eileen Fry"},"datePublished":"2016-07-07T11:38:08Z","reviewBody":"I've been making this for over 2 months now and will pass on this recipe for generations. Simply the best! This is an update to my previous post. All purpose flour is what I use for this recipe and it's perfect! However, tonight I used the cake and bread flour as the recipe suggested. What a mistake! The cookie was on the heavier side and it's more cakey. My kids wondered what happened and demanded the original cookie. Will definitely be sticking to all purpose flour from now on."},{"@type":"Review","author":{"@type":"Person","name":"Alice"},"datePublished":"2017-03-17T20:34:38Z","reviewBody":"I've found it works really well rolling the dough into logs, wrapping with greaseproof paper, then cling flim, and freezing. Then I just slice off (through the wrapping) cookie segments about 1 1/2 inches thick, and bake from frozen."},{"@type":"Review","author":{"@type":"Person","name":"Caroline"},"datePublished":"2015-09-14T18:02:07Z","reviewBody":"I want to try those but I'm scared with the amount of sugar listed in the recipe. 450g sugar for 18 cookies? It means 25g sugar per cookie, almost 2 tablespoons?! Is there a way to put less sugar in the dough without changing the consistency of the final result? Thanks!"},{"@type":"Review","author":{"@type":"Person","name":"Laura"},"datePublished":"2016-10-23T16:16:48Z","reviewBody":"How much flour would I use if I use all purpose flour only and no cake flour? Thanks!"},{"@type":"Review","author":{"@type":"Person","name":"Min"},"datePublished":"2017-08-05T18:15:54Z","reviewBody":"Tip: heeding the advice of other commenters, I rolled the cookie dough into 4 logs, wrapped in plastic wrap, and then stuck it in the fridge. The next day, I just cut disks of the cookie dough (fairly easily), sprinkled sea salt, and stuck it in the oven. So easy and you don't have to struggle with hard cookie dough! I highly recommend, even if you don't have bread or cake flour!"},{"@type":"Review","author":{"@type":"Person","name":"Fast Eddie"},"datePublished":"2015-10-28T02:25:06Z","reviewBody":"I have made this cookie twice. I have found two things,<br/>First I can jam a lot of chocolate, white chocolate and nuts into this recipe, but it try not to exceed the recommended amount of recommended chocolate. However these are big cookies and can hold a lot of fillings. I use 3 types of chocolate, white chocolate and walnuts, but I think  pecans would be better.<br/><br/>Do not over bake, I found that on a good baking sheet with a good silicon sheet, that 14 to 15 min is perfect for a nice soft cookie."},{"@type":"Review","author":{"@type":"Person","name":"kristen"},"datePublished":"2017-01-08T08:47:52Z","reviewBody":"so if you use all purpose flour, what is the total amount used?  also do you let the butter reach room temp and soften before mixing?"},{"@type":"Review","author":{"@type":"Person","name":"Mistytailady"},"datePublished":"2016-01-31T19:54:07Z","reviewBody":"Great recipe!  I followed it with the exception of some recommendations from readers:  used a mixture of bittersweet, semisweet, and white chocolate; before chilling for 36 hours, I formed smaller than golfball-size balls and placed them in a large covered bowl (cannot imagine how hard it would be to work with the chilled, unformed dough); baked them on parchment lined baking sheets for 10 minutes before sprinkling a tiny pinch of flaked sea salt, then baked 5 minutes more."},{"@type":"Review","author":{"@type":"Person","name":"cj"},"datePublished":"2016-01-28T12:26:14Z","reviewBody":"Make 50 gram cookies (just under 2 ounces; a bit smaller than a golf ball), cook for 15 minutes. Flat disks work better than chips; the chocolate melts into layers. Use 10 ounces bittersweet and 10 ounces semisweet chocolate disks for a more complex flavor. The cookies should be puffy and starting to brown when you take them out of the oven. Using parchment paper makes it easy to transfer cookies from baking sheet to rack to cool further; let them cool completely before removing from parchment."},{"@type":"Review","author":{"@type":"Person","name":"jenny w"},"datePublished":"2015-08-25T07:53:07Z","reviewBody":"I have made this so many times and every time people go CRAZY for them! I use Trader Joes chocolate that comes in a huge bar and then just chop it up with a butcher knife. This works perfectly and is very cost effective! Also, some of my people hate the salt on top, so I try to be fairly judicious when sprinkling it! Once you have made these you are going to be busy making them again and again and again and again and again!!!"}],"totalTime":"PT45M","url":"//cooking.nytimes.com/recipes/1015819-chocolate-chip-cookies","video":{"@id":"nyt://video/3b4690d3-8b28-59f8-936c-3ad783f5e3dc","@type":"VideoObject","author":{"@id":"nyt://person/0f1a5b18-7e38-59fe-8132-b5015cd37148","@type":"Person","name":"The New York Times","url":"https://www.nytimes.com/by/the-new-york-times"},"bitrate":"0","contentSize":"31332196","contentUrl":"https://vp.nyt.com/video/2020/10/28/89532_1_Recipe-Video-CCCookies_wg_480p.mp4","creator":{"@id":"nyt://person/0f1a5b18-7e38-59fe-8132-b5015cd37148","@type":"Person","name":"The New York Times","url":"https://www.nytimes.com/by/the-new-york-times"},"dateModified":"2026-06-04T13:20:52.028Z","datePublished":"2020-10-28T19:44:58.000Z","description":"This may become your new favorite chocolate chip cookie recipe. The secret to the best cookies is a mixture of cake and bread flour. They’re fluffy, crispy and chewy at the same time. The giant chocolate discs don’t hurt either.","duration":"PT2M33S","height":"480","name":"Chocolate Chip Cookies","publisher":{"@id":"https://www.nytimes.com/#publisher","@type":"NewsMediaOrganization","name":"The New York Times"},"thumbnail":[{"@id":"nyt://image/221a2f19-e3c7-5ea0-bfcb-67910aba12fe#videoSixteenByNineJumbo1600","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2022/02/12/dining/JT-Chocolate-Chip-Cookies/JT-Chocolate-Chip-Cookies-videoSixteenByNineJumbo1600.jpg","creditText":"Ryan Liebe for The New York Times. Food Stylist: Barrett Washburne.","dateModified":"2025-06-04T12:04:35.308Z","datePublished":"2022-02-12T17:49:09.000Z","height":"900","uploadDate":"2022-02-12T17:49:09.000Z","url":"https://static01.nyt.com/images/2022/02/12/dining/JT-Chocolate-Chip-Cookies/JT-Chocolate-Chip-Cookies-videoSixteenByNineJumbo1600.jpg","width":"1600"},{"@id":"nyt://image/221a2f19-e3c7-5ea0-bfcb-67910aba12fe#googleFourByThree","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2022/02/12/dining/JT-Chocolate-Chip-Cookies/JT-Chocolate-Chip-Cookies-googleFourByThree-v2.jpg","creditText":"Ryan Liebe for The New York Times. Food Stylist: Barrett Washburne.","dateModified":"2025-06-04T12:04:35.308Z","datePublished":"2022-02-12T17:49:09.000Z","height":"600","uploadDate":"2022-02-12T17:49:09.000Z","url":"https://static01.nyt.com/images/2022/02/12/dining/JT-Chocolate-Chip-Cookies/JT-Chocolate-Chip-Cookies-googleFourByThree-v2.jpg","width":"800"},{"@id":"nyt://image/221a2f19-e3c7-5ea0-bfcb-67910aba12fe#mediumSquareAt3X","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2022/02/12/dining/JT-Chocolate-Chip-Cookies/JT-Chocolate-Chip-Cookies-mediumSquareAt3X.jpg","creditText":"Ryan Liebe for The New York Times. Food Stylist: Barrett Washburne.","dateModified":"2025-06-04T12:04:35.308Z","datePublished":"2022-02-12T17:49:09.000Z","height":"1800","uploadDate":"2022-02-12T17:49:09.000Z","url":"https://static01.nyt.com/images/2022/02/12/dining/JT-Chocolate-Chip-Cookies/JT-Chocolate-Chip-Cookies-mediumSquareAt3X.jpg","width":"1800"},{"@id":"nyt://image/221a2f19-e3c7-5ea0-bfcb-67910aba12fe#facebookJumbo","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2022/02/12/dining/JT-Chocolate-Chip-Cookies/JT-Chocolate-Chip-Cookies-facebookJumbo.jpg","creditText":"Ryan Liebe for The New York Times. Food Stylist: Barrett Washburne.","dateModified":"2025-06-04T12:04:35.308Z","datePublished":"2022-02-12T17:49:09.000Z","height":"550","uploadDate":"2022-02-12T17:49:09.000Z","url":"https://static01.nyt.com/images/2022/02/12/dining/JT-Chocolate-Chip-Cookies/JT-Chocolate-Chip-Cookies-facebookJumbo.jpg","width":"1050"}],"thumbnailUrl":["https://static01.nyt.com/images/2022/02/12/dining/JT-Chocolate-Chip-Cookies/JT-Chocolate-Chip-Cookies-videoSixteenByNineJumbo1600.jpg","https://static01.nyt.com/images/2022/02/12/dining/JT-Chocolate-Chip-Cookies/JT-Chocolate-Chip-Cookies-googleFourByThree-v2.jpg","https://static01.nyt.com/images/2022/02/12/dining/JT-Chocolate-Chip-Cookies/JT-Chocolate-Chip-Cookies-mediumSquareAt3X.jpg","https://static01.nyt.com/images/2022/02/12/dining/JT-Chocolate-Chip-Cookies/JT-Chocolate-Chip-Cookies-facebookJumbo.jpg"],"uploadDate":"2020-10-28T19:44:58.000Z","url":"https://www.nytimes.com/video/embedded/dining/100000007420657/chocolate-chip-cookies.html","width":"854"}}</script>
<script type="application/ld+json" data-next-head="">{"@context":"https://schema.org","@id":"//cooking.nytimes.com/recipes/1015819-chocolate-chip-cookies","@type":"WebPage","alternateName":"Chocolate Chip Cookies","author":{"@id":"nyt://person/07566d9b-eef7-50ad-b461-613c924cad75","@type":"Person","name":"David Leite"},"copyrightHolder":{"@id":"https://cooking.nytimes.com/#publisher","@type":"Organization","name":"NYT Cooking"},"copyrightYear":2008,"dateModified":"2025-12-29T00:00:00Z","datePublished":"2008-07-09T00:00:00Z","description":"You may have memorized the foolproof gem on the back of the Toll House bag, given to the world by Ruth Graves Wakefield in the 1930s. But this may become your new favorite chocolate chip cookie recipe. It’s a little more complicated, and you’ll have to plan ahead: After assembling the dough, you must chill it for at least 24 hours before baking it, and preferably up to 36. This allows the dry ingredients time to soak up the wet ones, which results in a firmer dough. It leads to a marvelously chewy, chocolate-rich cookie. Don’t skimp on good chocolate, and the sea salt is not an option — it’s the beacon at the top of this gorgeous treat. (You can certainly put this recipe together by hand, but a stand mixer makes it easy work. If you’re in the market for one, our colleagues at The Wirecutter have tested quite a few, and they've put together an excellent guide to the best.) David Leite","hasPart":{"@type":"WebPageElement","cssSelector":".recipe","isAccessibleForFree":false},"isAccessibleForFree":false,"isPartOf":{"@type":["CreativeWork","Product"],"name":"NYT Cooking","productID":"cooking.nytimes.com:basic"},"name":"Best Chocolate Chip Cookies","publisher":{"@id":"https://cooking.nytimes.com/#publisher","@type":"Organization","name":"NYT Cooking"},"url":"//cooking.nytimes.com/recipes/1015819-chocolate-chip-cookies"}</script>
