<script type="application/ld+json">[{"@context":"http://schema.org","@type":"Recipe","mainEntityOfPage":true,"name":"Baked Macaroni and Cheese","url":"https://www.foodnetwork.com/recipes/alton-brown/baked-macaroni-and-cheese-recipe-1939524","headline":"Baked Macaroni and Cheese","description":"Get Alton Brown's Baked Macaroni and Cheese from Good Eats on Food Network, a classic recipe made with cheddar cheese and topped with buttery breadcrumbs.","author":[{"@type":"Person","name":"Alton Brown","url":"https://www.foodnetwork.com/profiles/talent/alton-brown"}],"image":[{"@type":"ImageObject","url":"https://food.fnr.sndimg.com/content/dam/images/food/fullset/2011/6/6/0/EA1E10_Baked-Macaraoni-and-Cheese_s4x3.jpg.rend.hgtvcom.1280.1280.suffix/1382540004120.webp","height":"1280","width":"1280","description":"Baked Macaroni and Cheese; Alton Brown"},{"@type":"ImageObject","url":"https://food.fnr.sndimg.com/content/dam/images/food/fullset/2011/6/6/0/EA1E10_Baked-Macaraoni-and-Cheese_s4x3.jpg.rend.hgtvcom.1280.960.suffix/1382540004120.webp","height":"960","width":"1280","description":"Baked Macaroni and Cheese; Alton Brown"},{"@type":"ImageObject","url":"https://food.fnr.sndimg.com/content/dam/images/food/fullset/2011/6/6/0/EA1E10_Baked-Macaraoni-and-Cheese_s4x3.jpg.rend.hgtvcom.1280.720.suffix/1382540004120.webp","height":"720","width":"1280","description":"Baked Macaroni and Cheese; Alton Brown"}],"datePublished":"2015-07-22T10:03:35.315-04:00","dateModified":"2014-09-29T12:37:33.574-04:00","publisher":{"@type":"Organization","name":"Food Network","url":"https://www.foodnetwork.com","logo":{"@type":"ImageObject","url":"https://food.fnr.sndimg.com/etc/clientlibs/assets/images/food/fn-logo-flat-60x60.png","height":"60","width":"60"}},"keywords":"Vegetarian,Thanksgiving Side Dishes,Thanksgiving,Side Dish,Pasta Recipes,Main Dish,Macaroni and Cheese,Comfort Food,Cheddar,American","cookTime":"P0Y0M0DT0H45M0.000S","prepTime":"P0Y0M0DT0H20M0.000S","totalTime":"P0Y0M0DT1H5M0.000S","recipeIngredient":["1/2 pound elbow macaroni","3 tablespoons butter","3 tablespoons flour","1 tablespoon powdered mustard","3 cups milk","1/2 cup yellow onion, finely diced","1 bay leaf","1/2 teaspoon paprika","1 large egg","12 ounces sharp cheddar, shredded","1 teaspoon kosher salt","Fresh black pepper","3 tablespoons butter","1 cup panko bread crumbs"],"nutrition":{"@type":"NutritionInformation","servingSize":"1 of 8 servings","calories":"465","fatContent":"27g","saturatedFatContent":"16g","carbohydrateContent":"36g","fiberContent":"2g","sugarContent":"6g","proteinContent":"19g","cholesterolContent":"97mg","sodiumContent":"471mg"},"recipeInstructions":[{"@type":"HowToStep","text":"Preheat oven to 350 degrees F."},{"@type":"HowToStep","text":"In a large pot of boiling, salted water cook the pasta to al dente."},{"@type":"HowToStep","text":"While the pasta is cooking, in a separate pot, melt the butter. Whisk in the flour and mustard and keep it moving for about five minutes. Make sure it's free of lumps. Stir in the milk, onion, bay leaf, and paprika. Simmer for ten minutes and remove the bay leaf."},{"@type":"HowToStep","text":"Temper in the egg. Stir in 3/4 of the cheese. Season with salt and pepper. Fold the macaroni into the mix and pour into a 2-quart casserole dish. Top with remaining cheese."},{"@type":"HowToStep","text":"Melt the butter in a saute pan and toss the bread crumbs to coat. Top the macaroni with the bread crumbs. Bake for 30 minutes. Remove from oven and rest for five minutes before serving."},{"@type":"HowToStep","text":"Remember to save leftovers for fried Macaroni and Cheese."}],"aggregateRating":{"@type":"AggregateRating","ratingValue":4.2,"reviewCount":2737},"recipeYield":"6 to 8 servings","review":[{"@type":"Review","author":{"@type":"Person","name":"Foodie101"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Great basic mac &amp; cheese recipe. I\u2019ve made it many times with onions and without. (Both were good but my personal preference is without the onions).  Once I forgot to put the remaining 1/4 cheese on the topping and I didn\u2019t even miss it so if I want to make a lower cal version, I\u2019ll cut back on the cheese. "},{"@type":"Review","author":{"@type":"Person","name":"Rgingold"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Love this recipe! I must confess years ago I\u2019d  overlooked the \u201c1/2 lb\u201d of pasta and just assumed it was one box (which is 1lb!) so the first several times it wasn\u2019t as creamy as when I doubled the recipe to accommodate the full 1lb of pasta! I tweak it often by using Smoked Gruyère cheese for 1/2 the cheese, I add only half of the mustard powder, I add a teaspoon of hot sauce (similar effect to the paprika), I also add a bit more Kosher salt and I use 1 tsp onion powder instead of 1/2 onion (when doubling I use 2 tsp.- my family\u2019s preference on the onion powder vs real onion  and just less mustard powder!). Just be sure to cook only on the lowest setting and stir constantly- it\u2019s easy to burn the roux and stir up burned bits into the sauce &amp; then it\u2019s a mess!!! Adding Gruyère seems to be a hit- for ten years I\u2019ve been asked to make this for every event/holiday. If I can\u2019t attend the event, my nephews hope I drop it off the day before! Now, I\u2019m asked to make it as gifts for friends! I just made a quadruple batch TWICE this weekend for a giant family birthday then as gifts! Whew!!! Thank you Alton Brown- you\u2019ve taught us all sooo much!!!"},{"@type":"Review","author":{"@type":"Person","name":"Brenda D."},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"I've made this recipe numerous times and it's still my favorite.  Not only is the dish tasty (with a little zing due to mustard and paprika?), but the consistency is creamy with a nice crunch from the topping.  Not sure why ratings would be less than 5 stars since it beats any recipes I've tried to date AND there's an added bonus in that the leftovers don't clump up into a brick like some others that I've tried.  In fact, once the flavors settle in, second day helpings improve in flavor while remaining creamy."},{"@type":"Review","author":{"@type":"Person","name":"alicia g."},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"I've made this many times always comes out awesome! Ina Gartens mac and cheese recipe is my 2nd fav, both are my go to recipes depending on the flavor I'm going for (hers uses nutmeg and gruyere cheese so a different flavor than this). I was curious to try the mac and cheese recipe that he has on his website as it's quite different than this one (no onion, no egg, uses half and half) and I can say I absolutely like this one far more. I personally like the onion and egg, gives it good flavor and a more thick custard like base."},{"@type":"Review","author":{"@type":"Person","name":"Cozet"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"I've been making for years now. It is always a family favorite. It's got a depth of, oh my, what is that undertone!? To it. "},{"@type":"Review","author":{"@type":"Person","name":"wonkosummers"},"reviewRating":{"@type":"Rating","ratingValue":4,"worstRating":"1","bestRating":"5"},"reviewBody":"Good structure of a recipe.  Doubles well.  The second time I made it I added 8 oz. Cream cheese, which gave it some funk and creaminess.  Next time I\u2019m going to try using American cheese. "},{"@type":"Review","author":{"@type":"Person","name":"rgillespie856"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Loved it. I sauteed my onion in the butter before I added the flour and mustard, which is how I make my potatoes au gratin. I used a blend of cheeses in the base and topped with sharp cheddar. Good flavor, smooth and creamy with the nice panko topping. I'll make it again!"},{"@type":"Review","author":{"@type":"Person","name":"enogsiereh"},"reviewRating":{"@type":"Rating","ratingValue":3,"worstRating":"1","bestRating":"5"},"reviewBody":"This recipe is bunk. Cheese splits in sauce at 160 so it will split at 350 for 30 min. I would warm it in the oven with stirring it every 5 minutes until warm. From there, sprinkle cheese and breadcrumbs, broil then pull. If you bake it at 350, it will be clumpy. "},{"@type":"Review","author":{"@type":"Person","name":"bvoyles52"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"This is my go to mac and cheese recipe.... Made it several times... I usually bake it in my Traeger pellet smoker... Gives it a nice smoky flavor......<br />i"},{"@type":"Review","author":{"@type":"Person","name":"Rachel C."},"reviewRating":{"@type":"Rating","ratingValue":2,"worstRating":"1","bestRating":"5"},"reviewBody":"I followed exactly. Grated my own cheese and it was grainy and barely cheesy and just bland. Disappointed "},{"@type":"Review","author":{"@type":"Person","name":"daotajuan"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Love this receipe...I keep coming back to it and its always a hit with company.. I've added broccoli, bacon, spinach, tweaked the cheese blend to accommodatebut I always use this same base for its delicious."},{"@type":"Review","author":{"@type":"Person","name":"Patricia"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"I read reviews before choosing which recipe to use.  Many complained it was grainy and they didn't know why.  It's because you got in a hurry and let your dairy come to a full boil.  You want your sauce to simmer, but keep your heat at medium or slightly lower and stir nearly constantly to prevent a full boil, or your dairy will separate and become grainy.  Likewise, when you sauce has thickened, remove it from the heat and stir a few times before adding your cheese so it doesn't separate.  This is a good recipe for a custard based mac.  We like our mac a little creamier, so I left out the egg.  Also, the onion is good, but must be a very fine dice unless you want lumps of onion.  I actually put my onion in the food processor since I was going to be getting it dirty to shred my cheese anyway."},{"@type":"Review","author":{"@type":"Person","name":"davehealey"},"reviewRating":{"@type":"Rating","ratingValue":2,"worstRating":"1","bestRating":"5"},"reviewBody":"Not the best mac and cheese, wont make this one again. Leave out onion and egg and it might be better."},{"@type":"Review","author":{"@type":"Person","name":"jodi g."},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Alton, you rock! This our family\u2019s go to for mac mac, yum! I didn\u2019t have the dry mustard today so I sadly went without. But it was still so good! "},{"@type":"Review","author":{"@type":"Person","name":"helenymiller.nbcu"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Yummy!"},{"@type":"Review","author":{"@type":"Person","name":"Anonymous"},"reviewRating":{"@type":"Rating","ratingValue":4,"worstRating":"1","bestRating":"5"},"reviewBody":"I\u2019ve made this mac and cheese recipe many, many times with the onions and without (prefer it without), and it doesn\u2019t disappoint. However, flavor-wise, I prefer Martha Stewart\u2019s version of mac and cheese with the gruyere, sharp white cheddar, breadcrumbs, etc."},{"@type":"Review","author":{"@type":"Person","name":"Jamie Duderstadt"},"reviewRating":{"@type":"Rating","ratingValue":2,"worstRating":"1","bestRating":"5"},"reviewBody":"Super grainy. Somehow not cheesy!  We were super bummed!"},{"@type":"Review","author":{"@type":"Person","name":"clisttix49"},"reviewRating":{"@type":"Rating","ratingValue":4,"worstRating":"1","bestRating":"5"},"reviewBody":"This recipe confounds me.  I saw this show when it first aired.  At least 20 years ago.  I loved it.  Always turned out great, for first decade.<br /><br />Except, last 8-10 years, it comes out grainy.  No, I don't use preshredded cheese.  I rarely make it anymore... it's like I'm doomed.  But I try every two years or so.  Tried tonight... dry and grainy.  No deviation from recipe that used to yield excellent results.<br /><br />Very confused."},{"@type":"Review","author":{"@type":"Person","name":"verajackson7"},"reviewRating":{"@type":"Rating","ratingValue":4,"worstRating":"1","bestRating":"5"},"reviewBody":"My husband and I loved toe recipe. I did caramel ice my onions for extra flavor. I used 8oz sharp cheddar, 3oz Gouda and 1oz Parmesan. The cheese sauce was spectacular and I had extra noodles so I put the sauce on them. So creamy and good but when I cooked the Mac and cheese it was sooo gritty. Can anyone tell me why? <br />Vera J"},{"@type":"Review","author":{"@type":"Person","name":"monicasauve"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"This is truly the best Mac &amp; cheese recipe on the foodnetwork site! ( I've tried lots of them).I used 3/4's extra old cheddar and 1/4 mozzarella  plus a sprinkle parmesan.I do not spread bread crumbs over it.. but real- crumbled bacon -  it's been at least 5 yrs that I have played with this recipe..try it you won't  be disappointed, it's the best on this site."},{"@type":"Review","author":{"@type":"Person","name":"Kathy V."},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"This turned great for me. Don\u2019t go cheap on the cheese, you need to use a quality cheddar. "},{"@type":"Review","author":{"@type":"Person","name":"sandy c."},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Delicious and easy"},{"@type":"Review","author":{"@type":"Person","name":"Food Network User"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Best Mac and Cheese!  I decreased the salt to 1/2 tsp kosher salt, which was perfect. Also substituted skim milk for whole and it was still creamy and delicious and a sweet onion to tone down the onion flavor.  Made it all in a Dutch oven and then transferred to a casserole dish before baking.  I agree with another reviewer that the pinko bread crumbs made this dish extra special.  You just can\u2019t go wrong with this recipe!"},{"@type":"Review","author":{"@type":"Person","name":"Food Network User"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"I haven't made this in years. I got cheese on sale (we like to use mixed cheeses/cheese ends) and thought I had panko. Alas, no panko. I had to use crushed cheez its instead. I was not disappointed lol. And definitely try to save a serving to fry later. Yum"},{"@type":"Review","author":{"@type":"Person","name":"sierrasierrasierra"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"The panko topping really makes it."},{"@type":"Review","author":{"@type":"Person","name":"Stephanie Smith-Hemann"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Thankful Queen "},{"@type":"Review","author":{"@type":"Person","name":"Food Network User"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"This is by far our favorite baked mac and cheese recipe. It stays creamy and moist instead of turning into flavorless, dry, noodle brick like other recipes we tried. We love the extra seasoning and crunchy panko topping! 5 star keeper recipe!"},{"@type":"Review","author":{"@type":"Person","name":"Food Network User"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"New family favorite - a bit of work, but once you\u2019re made it a couple times it goes quicker. When you follow the recipe and simmer the onions in the milk for 10 minutes they add a perfect tender crisp texture. Terrific recipe as is yet flexible for playing with spice and mixing cheese varieties if you\u2019re feeling adventurous. "},{"@type":"Review","author":{"@type":"Person","name":"Food Network User"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Have made several times now. I make a double batch, cooking in a 9\"x14\" deep pan with plenty of room to prevent spilling. I use whole milk, but will use up to 2 cups of 2% because the bottles are 32 oz around here and I don't usually use whole on a daily basis. Prefer red onions, but when I can get them I cut back a few tablespoons and dice very fine. For all out decadence I really like adding Dungeness Crab meat (2lbs for the entire double batch, or 1 lbs tossed into 1 half) Lobster is also good and likely cheaper. (Cooked and drained) Bacon is also a great addition. Otherwise, I stick pretty close to this recipe. It's great, well worth the effort. Even better fried the next day(s). Leftovers freeze well but if making to freeze, don't add the crab or lobster (Bacon is fine)."},{"@type":"Review","author":{"@type":"Person","name":"ROBYN HOLLIER-THOMPSON"},"reviewRating":{"@type":"Rating","ratingValue":1,"worstRating":"1","bestRating":"5"},"reviewBody":"The onions need to be sautéed or something. Or, don\u2019t put them in at all. "},{"@type":"Review","author":{"@type":"Person","name":"p2alcaraz"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Family\u2019s ultimate favorite!"},{"@type":"Review","author":{"@type":"Person","name":"Anne G."},"reviewRating":{"@type":"Rating","ratingValue":3,"worstRating":"1","bestRating":"5"},"reviewBody":"Love this recipe and have been making for years!  Only thing I do is use different cheeses. It\u2019s a family favorite and is a must have at Thanksgiving!"},{"@type":"Review","author":{"@type":"Person","name":"Food Network User"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Sorry Alton, but my kids think this mac and cheese is \"my\" best dish and my whole family looks forward to it every year. I've been making it for years. I never lied but I'm yet to confess it's not exactly \"my\" dish ;) PS. \"My\" famous Ham that everyone calls to make sure I'm making every year........ yours too! LoL"},{"@type":"Review","author":{"@type":"Person","name":"Food Network User"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"I\u2019ve made this recipe for many years , with my family always asking for more . I do substitute milk with evaporated milk  , and use 6oz extra sharp / 6oz sharp cheese . Layers of flavor . "},{"@type":"Review","author":{"@type":"Person","name":"Evan Brown"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Yuk"},{"@type":"Review","author":{"@type":"Person","name":"Food Network User"},"reviewRating":{"@type":"Rating","ratingValue":3,"worstRating":"1","bestRating":"5"},"reviewBody":"Can this be doubled for a 9×13 ? Need more for Thanksgiving "},{"@type":"Review","author":{"@type":"Person","name":"Food Network User"},"reviewRating":{"@type":"Rating","ratingValue":3,"worstRating":"1","bestRating":"5"},"reviewBody":"I followed the recipe exactly. The flavor was not very good. Kind of bland and reminded me of stuffing not macaroni. Not the worst thing I\u2019ve tasted but I will definitely not be making this again."},{"@type":"Review","author":{"@type":"Person","name":"Hayward S."},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"By far the best Mac and Cheese. Hands down. I always get rave reviews when I make it!<br />"},{"@type":"Review","author":{"@type":"Person","name":"Food Network User"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"I add spicy Italian sausage and increase the paprika and mustard powder.  I also use a combination of cheeses depending on what i have around.  This recipe is a great template to adjust to your liking."},{"@type":"Review","author":{"@type":"Person","name":"Kasey L."},"reviewRating":{"@type":"Rating","ratingValue":2,"worstRating":"1","bestRating":"5"},"reviewBody":"Way too dry, not creamy or cheesy enough "},{"@type":"Review","author":{"@type":"Person","name":"Food Network User"},"reviewRating":{"@type":"Rating","ratingValue":3,"worstRating":"1","bestRating":"5"},"reviewBody":"I followed the recipe and found it to be okay.  Both my husband and I found it rather bland. "},{"@type":"Review","author":{"@type":"Person","name":"Gloria WilkErson"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"This recipe is way seasoned than the others on FN. I\u2019m looking for the \u201cpunch\u201d so I\u2019m trying this one next. First one I tried was FN from the magazine with three cheese.  It was fabulous but I\u2019m looking for the recipe to send me over to flavor town so to speak. "},{"@type":"Review","author":{"@type":"Person","name":"Anonymous"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"The best Mac n cheese recipe ever!!!!  "},{"@type":"Review","author":{"@type":"Person","name":"Food Network User"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"This has been my \u201cgo to\u201d recipe for years, 5 stars!!!!  "},{"@type":"Review","author":{"@type":"Person","name":"Katina Buie"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"This was a great recipe. My family loved it. The only difference is I used half sharp cheddar and half smoked Gouda."},{"@type":"Review","author":{"@type":"Person","name":"Anonymous"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"My go to! So flavorful and the texture is perfect! "},{"@type":"Review","author":{"@type":"Person","name":"Carly S."},"reviewRating":{"@type":"Rating","ratingValue":1,"worstRating":"1","bestRating":"5"},"reviewBody":"The taste of onion is soooo overwhelming; definitely wishing I had left it out. "},{"@type":"Review","author":{"@type":"Person","name":"lonniebonnie"},"reviewRating":{"@type":"Rating","ratingValue":4,"worstRating":"1","bestRating":"5"},"reviewBody":"I have made this several times. My wife, the Mac and cheese connoisseur, did not love it. I eliminated the mustard and egg. Still not good enough. I then changed the cheese for the sauce to Velveeta. I know I know, but it turned out very creamy. She loves it and so did the guys at work. This is my base Mac and cheese recipe. <br />No mustard, no egg. <br />¾ of the cheese velveeta - which goes in the sauce<br />¼ cheese is sharp cheddar - which goes on top. <br />All else the same. "},{"@type":"Review","author":{"@type":"Person","name":"Carla Puglionesi Mammarella"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Can this recipe be made a day ahead of time"},{"@type":"Review","author":{"@type":"Person","name":"Jacqueline Schwartz"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Great! Was wonderful and perfect!<br />Thank you.Jacqueline Harris-Schwartz"},{"@type":"Review","author":{"@type":"Person","name":"Anonymous"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"The tangy ness of the boxed variety comes from BUTTERMILK (dried powdered)\u2026I\u2019ve been cooking for more than 40 years and usually know what\u2019s good!"},{"@type":"Review","author":{"@type":"Person","name":"Sheila Gomez"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"My grandma would be proud of me making Mac-n-cheese this damn good!"},{"@type":"Review","author":{"@type":"Person","name":"Mary Pollock"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"So good. I improvised and added smoke paprika and cream cheese. Sooo Good"},{"@type":"Review","author":{"@type":"Person","name":"Anonymous"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Love this recipe. My go to mac and cheese.  I sub goldfish crackers and add hot sauce to mine.  But totally yum"},{"@type":"Review","author":{"@type":"Person","name":"Judy A. Goldhammer"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Good &amp; Easy"},{"@type":"Review","author":{"@type":"Person","name":"Gil Williams"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Easy to make and very delicious. Panko makes a nice accent for a topping"},{"@type":"Review","author":{"@type":"Person","name":"Anonymous"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Alton! Great as usual- question... evaporated milk?"},{"@type":"Review","author":{"@type":"Person","name":"Michel K."},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"I used Dubliner cheese and this is my family\u2019s favorite Mac and cheese!"},{"@type":"Review","author":{"@type":"Person","name":"joan w."},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"This was the best macaroni I  ever made.  So good. I  will start using receipes.   I didn't use the onions. 😊"},{"@type":"Review","author":{"@type":"Person","name":"Anonymous"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Love this recipe. I opted to leave out the onion and bay leaf. Looked like it was going to have too much liquid but it baked perfectly!"},{"@type":"Review","author":{"@type":"Person","name":"Anonymous"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Family favorite. They scrape the pot clean leaving nothing behind.<br />I add diced ham  and some shredded Asiago cheese to give it extra pizzazz."},{"@type":"Review","author":{"@type":"Person","name":"Anonymous"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"I would go as far as to say this is the only recipe you need.  It\u2019s gone the minute I make it.  I have only been told how amazing it is and it\u2019s the only Mac recipe I make.  This is a gem."},{"@type":"Review","author":{"@type":"Person","name":"MaryB"},"reviewRating":{"@type":"Rating","ratingValue":4,"worstRating":"1","bestRating":"5"},"reviewBody":"Very good.  I didn't add an onion, just a pinch of onion powder.  Next time - more breadcrumbs on top."},{"@type":"Review","author":{"@type":"Person","name":"Jack A."},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"I added a can of green chiles, and it turned out great"},{"@type":"Review","author":{"@type":"Person","name":"Laura Britten"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Honestly the best Mac &amp; cheese I\u2019ve ever made. Truly better than anything I\u2019ve had at a restaurant or made at home. Definitely worth taking every additional step, every ingredient adds massive amounts of flavor! Will 100% be making again! "},{"@type":"Review","author":{"@type":"Person","name":"Shela M."},"reviewRating":{"@type":"Rating","ratingValue":4,"worstRating":"1","bestRating":"5"},"reviewBody":"This is the best mac and cheese out there. It\u2019s super easy to make and has the classic taste you want in Mac &amp; Cheese. I like mine a little runny so I don\u2019t bake it as long as Alton suggests. "},{"@type":"Review","author":{"@type":"Person","name":"Anonymous"},"reviewRating":{"@type":"Rating","ratingValue":1,"worstRating":"1","bestRating":"5"},"reviewBody":"Perfect consistency, loved the double topping, but my god the onion. It made it nearly inedible, and I didn\u2019t even add as much as I was supposed to. Onion has no place in Mac and cheese. "},{"@type":"Review","author":{"@type":"Person","name":"jennifer hilliard"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Creamy, cheesy and delicious!"},{"@type":"Review","author":{"@type":"Person","name":"Food Network User"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"This is my go to \"fancy\" mac and cheese recipe that I make for Thanksgiving and Christmas. It's so delicious. The first time I made this I upped the amount of pasta because it seemed like it was too little, DO NOT do that. It got too dry in the oven, which I suppose should have been obvious. It was still good but not perfect. When I followed the recipe to a T after that it was perfect! <br />"},{"@type":"Review","author":{"@type":"Person","name":"theohedd"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Excellent recipe, once you get the tempering down it's pretty easy as well, although it is kind of a two-person job."},{"@type":"Review","author":{"@type":"Person","name":"Amanda Scholtka"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Soooo good! Kids loved it too. Left out the egg because I suck at tempering (never works for me) and switched out the diced onion for 1 tbsp onion powder (didn't want kids to notice it lol). "},{"@type":"Review","author":{"@type":"Person","name":"Jonas G."},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Pretty easy, with tasty results. I used smoked paprika instead, and omitted the topping, opting to broil it for a few minutes instead, to create a topcrust."},{"@type":"Review","author":{"@type":"Person","name":"SANDYEGGO"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"I'm going to try this recipe shortly with other mac &amp; cheese recipes.  I'm trying to find some yummy no meat recipes for this coming Lent.  Merry Christmas and Prayers for America this New Year 2021.  "},{"@type":"Review","author":{"@type":"Person","name":"Halle"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"The video was so funny! and I loved this recipe"},{"@type":"Review","author":{"@type":"Person","name":"Lee Ann"},"reviewRating":{"@type":"Rating","ratingValue":1,"worstRating":"1","bestRating":"5"},"reviewBody":"I have mad respect for Alton Brown, but this recipe was a major disappointment. Like another reviewer, I am now of the opinion that onion has no business in my mac and cheese; even though Iused a small amount, it permeated the dish. Thankfully, I was experimenting only on myself, and Grubhub delivers. "},{"@type":"Review","author":{"@type":"Person","name":"Heidi H."},"reviewRating":{"@type":"Rating","ratingValue":4,"worstRating":"1","bestRating":"5"},"reviewBody":"I love Alton and generally follow his processes but as an experienced home cook, I find the initial 5 min of stirring to make the roux unecessary overkill especially because of the size of the saucepan you\u2019ll be using. Just make sure it\u2019s well blended and not lumpy at all before adding any liquid. Add the milk very slowly at first, whisking a lot, then more at a time, more whisking, no problem. It doesn\u2019t have to be 15 min of initial cooking of the roux and milk base for the cheese sauce. If I don\u2019t have an onion, its some onion powder. I like a little Dijon over the ground, and a dash of Worcestershire. You can also add some seasoning to the butter for the crumbs- some paprika makes it prettier. "},{"@type":"Review","author":{"@type":"Person","name":"Food Network User"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"This recipe is the bomb! After trying various recipes for several years, this is my forever recipe. It\u2019s creamy, flavorful, and has a buttery, crispy topping. I was told by my family that I needed to add it to our Thanksgiving menu and indeed I did. I use sharp cheddar and Monterey Jack; 8 ounces of each to use up each bar I shred which is a little more than the recipe calls for. Scrumptious!"},{"@type":"Review","author":{"@type":"Person","name":"Ilana L."},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Delicious "},{"@type":"Review","author":{"@type":"Person","name":"mdspriggs"},"reviewRating":{"@type":"Rating","ratingValue":4,"worstRating":"1","bestRating":"5"},"reviewBody":"The breadcrumb topping was not as toasted as I expected, otherwise easy and very tasty to make. "},{"@type":"Review","author":{"@type":"Person","name":"Kelli M."},"reviewRating":{"@type":"Rating","ratingValue":3,"worstRating":"1","bestRating":"5"},"reviewBody":"I have other Mac &amp; Cheese recipes I enjoy more. I didn\u2019t realize how much I don\u2019t like onions in my macaroni &amp; cheese. "},{"@type":"Review","author":{"@type":"Person","name":"Hey Girl!"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Excellent! The mustard flavor makes it stand out.  This is my go to for Mac and cheese."},{"@type":"Review","author":{"@type":"Person","name":"Food Network User"},"reviewRating":{"@type":"Rating","ratingValue":4,"worstRating":"1","bestRating":"5"},"reviewBody":"More cheese <br />"},{"@type":"Review","author":{"@type":"Person","name":"Food Network User"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"Pretty good"},{"@type":"Review","author":{"@type":"Person","name":"Brina J."},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"I have used this recipe many times and it is a hit with the family."},{"@type":"Review","author":{"@type":"Person","name":"Tracy C."},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"I absolutely love this recipe"},{"@type":"Review","author":{"@type":"Person","name":"samusher"},"reviewRating":{"@type":"Rating","ratingValue":5,"worstRating":"1","bestRating":"5"},"reviewBody":"This is by far our favorite. I altered the recipe by adding asiago &amp; parmesan and used panko instead of regular bread crumbs. I may use some seasonings in the topping next time. Delicious!<br />"}],"video":{"@type":"VideoObject","name":"Baked Mac and Cheese","description":"Alton shares his secrets for making the perfect macaroni and cheese.","duration":"PT0H4M22S","thumbnailUrl":"https://food.fnr.sndimg.com/content/dam/images/food/video/5/59/590/5904/590428.jpg.rend.hgtvcom.406.305.suffix/1780642254380.webp","contentUrl":"https://www.foodnetwork.com/apps/api/playback?path=/etc/sni-asset/food/videos/0/01/012/0124/0124787","uploadDate":"2026-06-05T02:50:56.322-04:00"},"recipeCuisine":"american","recipeCategory":"side-dish"}, {"@context":"http://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"item":{"@id":"https://www.foodnetwork.com","name":"Home"}},{"@type":"ListItem","position":2,"item":{"@id":"https://www.foodnetwork.com/recipes","name":"Recipes"}},{"@type":"ListItem","position":3,"item":{"@id":"https://www.foodnetwork.com/recipes/main-dish","name":"Main Dishes"}},{"@type":"ListItem","position":4,"item":{"@id":"https://www.foodnetwork.com/recipes/main-dish/pasta","name":"Pasta"}},{"@type":"ListItem","position":5,"item":{"@id":"https://www.foodnetwork.com/recipes/main-dish/pasta/macaroni-and-cheese","name":"Macaroni And Cheese"}},{"@type":"ListItem","position":6,"item":{"@id":"https://www.foodnetwork.com/recipes/alton-brown/baked-macaroni-and-cheese-recipe-1939524","name":"Baked Macaroni and Cheese"}}]}]</script>
