,
"reviewBody": "It kills me how people go in and mutilate a perfectly good recipe. Then you have bad reviews and more mutilations. I read these reviews and decided I'd make the recipe just as it calls and I recommend not changing a thing (except maybe adding 1/2 tsp of vanilla to your egg mixture). I DO recommend sifting the flour, twice. That makes for a fluffier pancake. Let your egg and milk set at room tempurature and use unsalted butter. Beat your egg, add the melted butter and beat lightly until blended, then lightly beat in your milk (careful not to overbeat your egg). Add to your dry mixture. Your result is a fluffy, delicious, good old fashion pancake. This is one is a keeper!"
},
{
"@type": "Review",
"reviewRating": {

"ratingValue": "5"
},
"author": {
"@type": "Person",
"name": "K.C"
},
"reviewBody": "I think that people should already know by now that if something goes wrong, it is NOT THIS RECIPE'S FAULT. This is a perfect recipe, it works, and it's just plain right. After reading some of the reviews, there are a few common problems amongst them. 1) Do not use COLD MILK. Start with warm milk. Heat up the milk before using it. Cold milk will only result in something that doesn't puff up during the cooking process. If you need to, melt the butter in the milk, that way your butter doesn't chunk up on you in the batter when the milk is cold. 2)Do NOT over mix your pancake batter! You will end up with FLAT and HEAVY pancakes. You need to mix it just enough, to where all your liquid ingredients are absorbed in the flour, but there are still lumps. The batter should almost look like it's \"rising\" with bubbles sort of. Beating up your pancake batter means beating up your family with bad pancakes. I'd like to add that the last pancakes out of the batter are going to be tougher than the first batch that came out. As the ladle goes in and out of the batter, that is working the gluten in the flour. Try to use an extra large ladle or scoop, so you can scoop multiple pancakes in one go, reducing the amount of times you dip into the batter. This helps ensure that all your pancakes will stay uniform and tender.",
"datePublished": "2010-05-20T11:04:49.180Z"
}
,
{
"@type": "Review",

"@type": "Person",
"name": "chefgodzilla"
},
"reviewBody": "As a chef it is interesting how many times friends will ask why something turns out tasting the way it does. I ask them if they tasted their ingredients...the answer being, no. With regards to the \"saltiness\" of these delicious pancakes, it is the baking powder. Go ahead, put a little in your mouth. To some, this will be VERY salty.\nAfterall, there is 3 1/2 teaspoons of baking powder in the recipe PLUS the teaspoon of salt. So, I recommend that for those that noted them to be to salty, leave out the teaspoon of salt.\nRemember, baking is chemistry, so do not mess with the baking powder as you will change the outcome of the rising properties of these pancakes. If they still seem to be too salty, try some zest of a lemon peel.",
"datePublished": "2008-11-08T12:44:36.603Z"
}

"name": "naples34102"
},
"reviewBody": "Other than forgetting to add the salt, which neither I nor hubby missed anyway, we found these delicious. These were light, fluffy, tender, thick and perfectly rounded pancakes. Quick and easy to mix up too! I've made other pancake recipes with more steps (like separating the egg yolks from the whites, beating the whites separately before folding into the batter) and didn't find these any less delicious. Also, I had really wanted to make buttermilk pancakes, but since I didn't have any I \"settled\" for these and didn't find the buttermilk pancakes necesssarily any better either. With quick and delicious recipes like this, there's no reason not to have fresh, homemade pancakes more often!",
"datePublished": "2009-01-04T09:10:53.213Z"
}

"@type": "Person",
"name": "PORUSGIRL"
},
"reviewBody": "Wow, these were absolutely fantastic. I read many reviews before I made these so I made some changes to the recipe based on all the reviews......I doubled the recipe and made the following changes. I used 4-teaspoons baking powder, 1-teaspoon cinnamon, 1/2-teaspoon nutmeg, 1-tablespoon vanilla, 1/2-teaspoon salt, 3-cups milk, 3 eggs lightly beaten and 1-stick butter......I melted the butter then added the milk to the butter and heated it (just heat, do not boil). So I had 3 bowls - 1 with the dry ingredients all sifted together, 1 with the warm liquids and 1 with the eggs lightly beaten. I then added the liquids to the dry ingredients and mixed a bit then added the eggs to the mixture. Mixed with a wire wisk until it was well blended together. I let it sit on the counter for 10-minutes before cooking. Served with bacon and eggs. This was made for 4-people and none was left. The kids told me these are best pancakes they have ever had and to never use bisquick again. Thank you so much for the fine recipe. Its a keeper.",
"datePublished": "2007-08-31T04:27:37.013Z"
}

"@type": "Person",
"name": "campagnes"
},
"reviewBody": "As I read through the reviews, I noticed that many people were upset with the \"overly baking-soda-y taste.\" Take note: The recipe calls for baking POWDER, not soda.. might account for many of the flavor/texture difficulties. This is a great recipe, my go-to pancake recipe. The only change I make is to reduce the salt by a bit more than half (a full teaspoon really is way too much). Other than that, these are perfect - light and fluffy, rich, and flavorful.",
"datePublished": "2010-10-25T19:46:36.933Z"
}

"author": {
"@type": "Person",
"name": "Stepford Wife"
},
"reviewBody": "I don't understand why people make variations to a recipe and then give it a poor rating after they've ruined it. It is unfair to the poster.\n\nI followed the recipe EXACTLY and in my opinion the pancakes were good. The batter did have a strong taste of baking powder but after the pancakes are cooked they taste fine, the baking powder flavor is diminished. The pancakes for me were a bit too heavy which is why I deducted a star but they were very good overall (the recipe called for the batter to be mixed until smooth which is what I did, but leaving lumps in batter actually makes pancakes fluffier when cooked). My husband says \"They were good baby, they weren't like ohhhh excellent, but they were good.\" Next time I will make variations such as using buttermilk, less baking powder, more sugar, adding vanilla, not overmixing; but I thought is was only fair to rate the recipe as it was given.",
"datePublished": "2007-12-10T09:46:34.613Z"
}
,

"author": {
"@type": "Person",
"name": "TRINITY7"
},
"reviewBody": "I made this as written with just adding some vanilla to the egg mixture. I mixed these as I do my other pancakes/waffles, I sifted the dry ingredients and let the eggs and milk come to room temp. When I combined the eggs and butter I emulsified them with a whisk then added the milk and vanilla. Once the dry and wet are combined I mix them lightly with a spatula (kind of folding them together) once they are somewhat combined I let them rest for a couple minutes and then give a quick mix. The key is not over mixing the batter, get it combined (with lumps) let it rest and then a quick blend, this results in a light airy pancakes that melts in your mouth. These are great!!",
"datePublished": "2011-08-13T06:53:31.963Z"
}
