h_term_string}"},"query-input":{"@type":"PropertyValueSpecification","valueRequired":true,"valueName":"search_term_string"}}],"inLanguage":"en-US"},{"@type":"Organization","@id":"https:\/\/sallysbakingaddiction.com\/#organization","name":"Sally's Baking","url":"https:\/\/sallysbakingaddiction.com\/","logo":{"@type":"ImageObject","inLanguage":"en-US","@id":"https:\/\/sallysbakingaddiction.com\/#\/schema\/logo\/image\/","url":"https:\/\/sallysbakingaddiction.com\/wp-content\/uploads\/2026\/05\/badge-sallys-baking.jpg","contentUrl":"https:\/\/sallysbakingaddiction.com\/wp-content\/uploads\/2026\/05\/badge-sallys-baking.jpg","width":696,"height":696,"caption":"Sally's Baking"},"image":{"@id":"https:\/\/sallysbakingaddiction.com\/#\/schema\/logo\/image\/"},"sameAs":["https:\/\/www.facebook.com\/SallysBakingAddiction","https:\/\/www.instagram.com\/sallysbakeblog\/","https:\/\/www.pinterest.com\/sallysbakeblog\/","https:\/\/www.tiktok.com\/@sallysbaking","https:\/\/www.youtube.com\/c\/SallysBakingAddictionVideo"]},{"@type":"Person","@id":"https:\/\/sallysbakingaddiction.com\/#\/schema\/person\/3744271f85efc7e271411c4968f1c4ba","name":"Sally McKenney","description":"Sally McKenney is a baker, food photographer, and New York Times best-selling author. Her kitchen-tested recipes and step-by-step tutorials have given millions of readers the knowledge and confidence to bake from scratch. Sally’s work has been featured on TODAY, Good Morning America, Taste of Home, People, and more.","sameAs":["https:\/\/sallysbakingaddiction.com\/about-sally-mckenney\/"]},{"@type":"Question","@id":"https:\/\/sallysbakingaddiction.com\/chewy-chocolate-chip-cookies\/#faq-question-1744296799402","position":1,"url":"https:\/\/sallysbakingaddiction.com\/chewy-chocolate-chip-cookies\/#faq-question-1744296799402","name":"Can I scoop and roll the dough before chilling, and chill the dough balls?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"Because of the melted butter in this dough, the dough is very soft and a little greasy before chilling, so it’s harder to shape the cookie dough balls. We recommend chilling first, then shaping. If after chilling the dough is very hard and difficult to scoop, let it sit at room temperature for 15 minutes and then try again.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/sallysbakingaddiction.com\/chewy-chocolate-chip-cookies\/#faq-question-1744297150248","position":2,"url":"https:\/\/sallysbakingaddiction.com\/chewy-chocolate-chip-cookies\/#faq-question-1744297150248","name":"Can I chill the dough in the freezer instead of the refrigerator to speed up the chilling process?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"We typically do not recommend jumping right to the freezer without chilling the dough first. A quick freeze like that can cause the dough to chill unevenly and then spread unevenly during the baking process. For best results, we recommend following the recipe as written. If you don't have time to wait for the dough to chill, try this recipe for 6 <a href=\"https:\/\/sallysbakingaddiction.com\/giant-chocolate-chip-cookies\/\">giant chocolate chip cookies<\/a> instead, which doesn't require dough chilling (see recipe Notes in that post for details on using the dough to make 24 regular-size cookies).","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/sallysbakingaddiction.com\/chewy-chocolate-chip-cookies\/#faq-question-1783339900907","position":3,"url":"https:\/\/sallysbakingaddiction.com\/chewy-chocolate-chip-cookies\/#faq-question-1783339900907","name":"Can I use brown butter in this recipe?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"You can certainly use brown butter here, and the flavor is outstanding! But they can be a little crumbly using brown butter. Instead, for best results, I suggest trying these <a href=\"https:\/\/sallysbakingaddiction.com\/brown-butter-chocolate-chip-cookies\/\">Brown Butter Chocolate Chip Cookies<\/a>.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@context":"https:\/\/schema.org\/","@type":"Recipe","name":"Chewy Chocolate Chip Cookies","description":"These super soft and chewy chocolate chip cookies are the most popular cookie recipe on my website for good reason. Melted butter, more brown sugar than white sugar, cornstarch, and an extra egg yolk guarantee the absolute chewiest chocolate chip cookie texture. The cookie dough is slick and requires chilling prior to shaping the cookies. This recipe is also in my New York Times best-selling cookbook, Sally's Baking 101.","author":{"@type":"Person","name":"Sally","url":"https:\/\/sallysbakingaddiction.com\/about-sally-mckenney\/"},"keywords":"chocolate chip cookies","image":["https:\/\/sallysbakingaddiction.com\/wp-content\/uploads\/2013\/05\/classic-chocolate-chip-cookies-225x225.jpg","https:\/\/sallysbakingaddiction.com\/wp-content\/uploads\/2013\/05\/classic-chocolate-chip-cookies-260x195.jpg","https:\/\/sallysbakingaddiction.com\/wp-content\/uploads\/2013\/05\/classic-chocolate-chip-cookies-320x180.jpg","https:\/\/sallysbakingaddiction.com\/wp-content\/uploads\/2013\/05\/classic-chocolate-chip-cookies.jpg"],"url":"https:\/\/sallysbakingaddiction.com\/chewy-chocolate-chip-cookies\/","recipeIngredient":["2 and 1\/4 cups (281g) all-purpose flour (spooned &amp; leveled)","1 teaspoon baking soda","1 and 1\/2 teaspoons cornstarch*","1\/2 teaspoon salt","3\/4 cup (170g\/12 Tbsp) unsalted butter, melted &amp; cooled for 5 minutes","3\/4 cup (150g) packed light or dark brown sugar","1\/2 cup (100g) granulated sugar","1 large egg + 1 egg yolk, at room temperature","2 teaspoons pure vanilla extract","1 and 1\/4 cups (225g) semi-sweet chocolate chips or chocolate chunks"],"recipeInstructions":[{"@type":"HowToStep","text":"In a large bowl, whisk the flour, baking soda, cornstarch, and salt together. Set aside.","url":"https:\/\/sallysbakingaddiction.com\/chewy-chocolate-chip-cookies\/#instruction-step-1"},{"@type":"HowToStep","text":"In a medium bowl, whisk the melted butter, brown sugar, and granulated sugar together until no lumps remain. Whisk in the egg and egg yolk until combined, then whisk in the vanilla extract. The mixture will be thin. Pour into dry ingredients and mix together with a large spoon or spatula. The dough will be very soft, thick, and shiny. Fold in the chocolate chips. The chocolate chips may not stick to the dough because of the melted butter, but do your best to combine them.","url":"https:\/\/sallysbakingaddiction.com\/chewy-chocolate-chip-cookies\/#instruction-step-2"},{"@type":"HowToStep","text":"Cover the dough tightly and refrigerate for at least 2 hours or up to 3 days. I highly recommend chilling the cookie dough overnight to prevent overspreading.","url":"https:\/\/sallysbakingaddiction.com\/chewy-chocolate-chip-cookies\/#instruction-step-3"},{"@type":"HowToStep","text":"Preheat oven to 325°F (163°C). Line large baking sheets with parchment paper or silicone baking mats. If the dough has chilled for longer than 2 hours, let it sit at room temperature for about 15 minutes.","url":"https:\/\/sallysbakingaddiction.com\/chewy-chocolate-chip-cookies\/#instruction-step-4"},{"@type":"HowToStep","text":"Using a cookie scoop or Tablespoon measuring spoon, scoop the chilled cookie dough, about 3 scant Tablespoons (about 2 ounces, or 60g) of dough for XL cookies or 2 heaping Tablespoons (about 1.75 ounces, or 50g) of dough for medium-large cookies. Roll into a ball, then use your fingers to shape the cookie dough so that it&#8217;s taller rather than wide—almost like a cylinder. This helps the cookies bake up thicker. Repeat with remaining dough. Arrange the cookies 3 inches apart on the prepared baking sheets.","url":"https:\/\/sallysbakingaddiction.com\/chewy-chocolate-chip-cookies\/#instruction-step-5"},{"@type":"HowToStep","text":"Bake the cookies for 13–14 minutes or until the edges are very lightly browned. The centers will look very soft, but the cookies will continue to set as they cool. Cool on the baking sheet for 10 minutes before transferring to a cooling rack to cool completely. While the cookies are still warm, I like to press a few more chocolate chips into the tops—this is optional and only for looks! ","url":"https:\/\/sallysbakingaddiction.com\/chewy-chocolate-chip-cookies\/#instruction-step-6"},{"@type":"HowToStep","text":"Store tightly covered at room temperature for up to 1 week.","url":"https:\/\/sallysbakingaddiction.com\/chewy-chocolate-chip-cookies\/#instruction-step-7"}],"prepTime":"PT15M","cookTime":"PT13M","totalTime":"PT2H45M","recipeYield":["16","16 XL cookies or 20 medium\/large cookies"],"recipeCategory":"Dessert","cookingMethod":"Baking","recipeCuisine":"American","aggregateRating":{"@type":"AggregateRating","reviewCount":"1996","ratingValue":"4.7"},"video":{"@context":"http:\/\/schema.org","@type":"VideoObject","name":"Chewy Chocolate Chip Cookies | Sally's Baking Recipes","description":"These super soft and chewy chocolate chip cookies are the most popular cookie recipe on my website for good reason. Melted butter, more brown sugar than white sugar, cornstarch, and an extra egg yolk guarantee the absolute chewiest chocolate chip cookie texture. \n\nGet the full recipe: https:\/\/sallysbakingaddiction.com\/chewy-chocolate-chip-cookies\/\n\n• Ask your recipe question or leave a review over on the recipe page.\n\n#baking #recipes #chocolatechipcookies\n\n• More of Sally's baking recipes: https:\/\/sallysbakingaddiction.com\/","duration":"PT1M","embedUrl":"https:\/\/www.youtube.com\/embed\/ne3KWSG6994?feature=oembed","contentUrl":"https:\/\/www.youtube.com\/watch?v=ne3KWSG6994","thumbnailUrl":["https:\/\/i.ytimg.com\/vi\/ne3KWSG6994\/hqdefault.jpg"],"uploadDate":"2022-05-11T20:48:34+00:00"},"review":[{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"author":{"@type":"Person","name":"Julie"},"datePublished":"2026-07-28","reviewBody":"I followed the recipe exactly as written for 50g cookies.  I weigh as much as possible and it is so much easier that way.  They look amazing!!  This takes the place of my old standby recipe on the bag!"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"1"},"author":{"@type":"Person","name":"Sondra Allen-Edwards"},"datePublished":"2026-07-29","reviewBody":"I followed the recipe to a T and they were extremely dry. I was excited to try them, but I am now removing from my pins"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"author":{"@type":"Person","name":"Emily"},"datePublished":"2026-07-31","reviewBody":"The first few times I made these cookies, they turned out perfectly! Third time, they didn't spread as well (I think I had a bit too much flour, didn't measure that last 1\/4 cup very well). Even without the spread and soft gooey-ness, they were delicious and cakey. So you really can't go wrong with this recipe, as long as you chill the dough first!"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"author":{"@type":"Person","name":"Fran"},"datePublished":"2026-08-01","reviewBody":"Delicious! I’ll tell you a little secret: tripping from kitchen to suitcase, to car, to kitchen, packing for a family trip, baking your gorgeous blueberry muffins, checking my to-do list, I made these cookies, my head swimming, and I forgot to add the milk! It which was measured and ready with all the other wet ingredients, but I simply overlooked it, and they turned out great! No one will ever know. This recipe is more time consuming due to forming the dough by hand, letting the cookies cool several minutes on the cookie sheet before, but they are delightful and early reviews are great. Thank you, Sally, once again."}],"datePublished":"2022-05-13","@id":"https:\/\/sallysbakingaddiction.com\/chewy-chocolate-chip-cookies\/#recipe","isPartOf":{"@id":"https:\/\/sallysbakingaddiction.com\/chewy-chocolate-chip-cookies\/#article"},"mainEntityOfPage":"https:\/\/sallysbakingaddiction.com\/chewy-chocolate-chip-cookies\/"}]}</script>
