,"recipeIngredient": [
"8 ounces unsalted butter (2 sticks; 225g)",
"1 standard ice cube (about 2 tablespoons; 30mL frozen water)",
"10 ounces all-purpose flour (about 2 cups; 280g)",
"3/4 teaspoon (3g) baking soda",
"2 teaspoons Diamond Crystal kosher salt or 1 teaspoon table salt (4g)",
"5 ounces granulated sugar (about 3/4 cup; 140g)",
"2 large eggs (100g)",
"2 teaspoons (10mL) vanilla extract",
"5 ounces dark brown sugar (about 1/2 tightly packed cup plus 2 tablespoons; 140g)",
"8 ounces (225g) semisweet chocolate, roughly chopped with a knife into 1/2- to 1/4-inch chunks",
"Coarse sea salt, for garnish" ]
,"recipeInstructions": [
{
"@type": "HowToStep"
,"image": [
{
"@type": "ImageObject",
"url": "https://www.seriouseats.com/thmb/tOSFObDguquBuznVmMH_v-4tm1w=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/__opt__aboutcom__coeus__resources__content_migration__serious_eats__seriouseats.com__recipes__20151110-chocolate-chip-cookies-vicky-wasik-005-f0d67cb4a36c4b7d9207c94de20afa6c.jpg"
}
]
,"text": "Melt butter in a medium saucepan over medium-high heat. Cook, gently swirling pan constantly, until particles begin to turn golden brown and butter smells nutty, about 5 minutes. Remove from heat and continue swirling the pan until the butter is a rich brown, about 15 seconds longer. Transfer to a medium bowl, whisk in ice cube, transfer to refrigerator, and allow to cool completely, about 20 minutes, whisking occasionally. (Alternatively, whisk over an ice bath to hasten the process.)"
} ,{
"@type": "HowToStep"
,"image": [
{
"@type": "ImageObject",
"url": "https://www.seriouseats.com/thmb/PPNxDuZjyC8fNIDYvuqCvdIKCe8=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/__opt__aboutcom__coeus__resources__content_migration__serious_eats__seriouseats.com__recipes__20151110-chocolate-chip-cookies-vicky-wasik-011-0d9c19fffa0143ab89e62910feaa559e.jpg"
}
]
,"text": "Meanwhile, whisk together flour, baking soda, and salt in a large bowl. Place granulated sugar, eggs, and vanilla extract in the bowl of a stand mixer fitted with the whisk attachment. Whisk on medium-high speed until mixture is pale brownish-yellow and falls off the whisk in thick ribbons when lifted, about 5 minutes."
} ,{
"@type": "HowToStep"
,"image": [
{
"@type": "ImageObject",
"url": "https://www.seriouseats.com/thmb/z5hSD7lNHXQ4_ai9H6tKw0RdH3U=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/__opt__aboutcom__coeus__resources__content_migration__serious_eats__seriouseats.com__recipes__20151110-chocolate-chip-cookies-vicky-wasik-024-5f6d12301f6440a5b1271f91d5ae3552.jpg"
}
]
,"text": "Fit paddle attachment onto mixer. When brown butter mixture has cooled (it should be just starting to turn opaque again and firm around the edges), add brown sugar and cooled brown butter to egg mixture in stand mixer. Mix on medium speed to combine, about 15 seconds. Add flour mixture and mix on low speed until just barely combined, with some dry flour still remaining, about 15 seconds. Add chocolate and mix on low speed until dough comes together, about 15 seconds longer. Transfer to an airtight container and refrigerate dough at least overnight and up to 3 days."
} ,{
"@type": "HowToStep"
,"image": [
{
"@type": "ImageObject",
"url": "https://www.seriouseats.com/thmb/4F3VTnePb4M1Sws11lDHqkGbeMc=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/__opt__aboutcom__coeus__resources__content_migration__serious_eats__seriouseats.com__recipes__20151110-chocolate-chip-cookies-vicky-wasik-029-90479694fd2743b1977f1f880969c369.jpg"
}
]
,"text": "When ready to bake, adjust oven racks to upper- and lower-middle positions and preheat oven to 325°F (160°C). Using a 1-ounce portion scoop or a spoon, place scoops of cookie dough onto a nonstick or parchment-lined baking sheet. Each ball should measure approximately 3 tablespoons in volume, and you should be able to fit 6 to 8 balls on each sheet. Tear each ball in half to reveal a rougher surface, then stick them back together with the rough sides facing outward. Transfer to oven and bake until golden brown around edges but still soft, 13 to 16 minutes, rotating pans back to front and top to bottom halfway through baking."
} ,{
"@type": "HowToStep"
,"text": "Remove baking sheets from oven. While cookies are still hot, sprinkle very lightly with coarse salt and gently press salt down to embed. Let cool for 2 minutes, then transfer cookies to a wire rack to cool completely."
} ,{
"@type": "HowToStep"
,"text": "Repeat steps 4 and 5 for remaining cookie dough. Allow cookies to cool completely before storing in an airtight container, plastic bag, or cookie jar at room temperature for up to 5 days."
} ]
