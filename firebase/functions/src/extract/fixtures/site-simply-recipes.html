,"recipeIngredient": [
"2 ripe avocados",
"1/4 teaspoon salt, plus more to taste",
"1 tablespoon fresh lime or lemon juice",
"2-4 tablespoons minced red onion or thinly sliced green onion",
"1-2 serrano (or jalapeño) chiles, stems and seeds removed, minced",
"2 tablespoons cilantro (leaves and tender stems), finely chopped",
"Pinch freshly ground black pepper",
"1/2 ripe tomato, chopped (optional)",
"Red radish or jicama slices for garnish (optional)",
"Tortilla chips , to serve" ]
,"recipeInstructions": [
{
"@type": "HowToStep"
,"name": "Cut the avocados:"
,"image": [
{
"@type": "ImageObject",
"url": "https://www.simplyrecipes.com/thmb/pYEdtm0o-jR0PMsPV7v-B-C4cRg=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/__opt__aboutcom__coeus__resources__content_migration__simply_recipes__uploads__2014__05__guacamole-method-1-800-989ca421ef1148a9b33d15eeefc06926.jpg"
}
]
,"text": "Cut the avocados in half. Remove the pit. Score the inside of the avocado with a blunt knife and scoop out the flesh with a spoon. (See How to Cut and Peel an Avocado .) Place in a bowl."
} ,{
"@type": "HowToStep"
,"name": "Mash the avocado flesh:"
,"image": [
{
"@type": "ImageObject",
"url": "https://www.simplyrecipes.com/thmb/ymp-gcWLfa7xQtPQEdQuhBseiLo=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/__opt__aboutcom__coeus__resources__content_migration__simply_recipes__uploads__2014__05__guacamole-method-2-800-fabac47f7d9a412fb8c7253926da52c4.jpg"
}
]
,"text": "Using a fork, roughly mash the avocado. Don’t overdo it! The guacamole should be a little chunky."
} ,{
"@type": "HowToStep"
,"name": "Add the remaining ingredients to taste:"
,"text": "Sprinkle with salt and lime (or lemon) juice. The acid in the lime juice will provide some balance to the richness of the avocado and will help delay the avocados from turning brown. Add the chopped onion, cilantro, black pepper, and chilis. Chili peppers vary individually in their spiciness. So, start with a half of one chili pepper and add more to the guacamole to your desired degree of heat. Remember that much of this is done to taste because of the variability in the fresh ingredients. Start with this recipe and adjust to your taste."
} ,{
"@type": "HowToStep"
,"name": "Serve immediately:"
,"text": "If making a few hours ahead, place plastic wrap on the surface of the guacamole and press down to cover it to prevent air reaching it. (The oxygen in the air causes oxidation which will turn the guacamole brown.) Garnish with slices of red radish or jicama strips. Serve with your choice of store-bought tortilla chips or make your own homemade tortilla chips . Refrigerate leftover guacamole up to 3 days. Note: Chilling tomatoes dulls their flavor. So, if you want to add chopped tomato to your guacamole, add just before serving."
} ,{
"@type": "HowToStep"
,"image": [
{
"@type": "ImageObject",
"url": "https://www.simplyrecipes.com/thmb/J4kA2m6jKMgkQwZhG-RYpjZBeFQ=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/Guacamole-LEAD-6-2-64cfcca253c8421dad4e3fad830219f6.jpg"
}
]
,"text": "Enjoy!"
} ]

,
"reviewBody": "I'm 64 and have had guac many times over the years only to not fine it flavorful. This recipe explains that the flavor is in the tastebuds of the maker! Wanting to see if there was a more flavorful recipe out there, I stumbled on this one. I followed the ingredients, though may have put more red onion then prescribed, and VOILA! Guac bursting with flavor (for me)! My husband and guests agreed it was tastier than others they've had. Don't be afraid to add your own spin!"
},
{
"@type": "Review",
"author": {
"@type": "Person",
"name": "Jake"
},
"reviewBody": "Guacamole is very good, this one is no exception of course. There were a few modifications I made that fit my personal taste. My recipe/proportions are as follows: Starting with half a red onion, juice from a whole lime, 3 jalapeno peppers, roughly 4 tbsp cilantro (I love cilantro), and a diced roma tomato (only the most firm parts--no seeds). Then you \"macerate\" by mixing all these ingredients in a bowl. If for some reason you believe this is too much to go into your guac, then you can put the rest aside as some delicious pico de gallo. Then you can move onto scooping (and mashing) the avocados. Then, mix everything together. For me, there was a bit much (the red onion I found was particularly large), so I had a side of pico de gallo as well. Once everything is mixed, season to taste. I used chili powder (imparts a nice smoky flavor), salt, and black pepper. Chili powder can be substituted with smoked paprika as necessary. Certainly limit the chili powder, however, because you don't want to tarnish the vibrant green of the guacamole, so only use enough spice to be hardly perceptible. One personal comment: I would discourage anybody from using raw garlic for guacamole. Garlic is a very overwhelming flavor, and a lot of guacamole is reliant on the subtle ways the flavors interact. You want a smooth guacamole that has occasional crunch imparted by the fresh veggies.",
"datePublished": "2018-06-29T07:09:23.000Z"
}
,
{

"@type": "Person",
"name": "FairApple4585"
},
"reviewBody": "Your recipe closely resembles what I had in Northern Mexico as a child. One common addition is a teaspoon or so of Knorr Suissa Caldo de Pollo, a powdered chicken bouillon used ubiquitously in Mexico. Also, I use key limes, which again are much more common in Mexico than lemons.Regarding testing for ripeness, an elderly gentleman in a grocery store once showed me a trick for testing avocados that doesn't damage them in the way that poking at them does. He said to gently test the stem and see if it wiggled. If so, the avocado is ready to eat. It has never failed me...and it's also a good way to tell if they are overripe. If that is the case, the stem will be completely wobbly and possibly break off.",
"datePublished": "2007-02-23T11:38:50.000Z"
}
