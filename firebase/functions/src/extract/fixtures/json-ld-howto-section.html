<!DOCTYPE html>
<html>
<head>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Recipe",
    "name": "Beef Bourguignon",
    "recipeIngredient": [
      "1 kg beef chuck",
      "750ml red wine",
      "200g mushrooms"
    ],
    "recipeInstructions": [
      {
        "@type": "HowToSection",
        "name": "Prep",
        "itemListElement": [
          { "@type": "HowToStep", "text": "Cut beef into cubes and pat dry." },
          { "@type": "HowToStep", "text": "Slice mushrooms." }
        ]
      },
      {
        "@type": "HowToSection",
        "name": "Cook",
        "itemListElement": [
          { "@type": "HowToStep", "text": "Brown beef in batches for 10 minutes." },
          { "@type": "HowToStep", "text": "Simmer with wine 2 hours." }
        ]
      }
    ]
  }
  </script>
</head>
<body><h1>Beef Bourguignon</h1></body>
</html>
