<!DOCTYPE html>
<html>
<head><title>Schema.org itemscope</title></head>
<body itemscope itemtype="https://schema.org/Recipe">
  <h1 itemprop="name">Banana Bread</h1>
  <span itemprop="recipeYield">8 slices</span>
  <meta itemprop="prepTime" content="PT15M" />
  <meta itemprop="cookTime" content="PT55M" />
  <img itemprop="image" src="https://example.com/banana.jpg" />
  <div itemprop="recipeIngredient">3 ripe bananas</div>
  <div itemprop="recipeIngredient">2 cups flour</div>
  <div itemprop="recipeInstructions">Mash bananas and bake 55 minutes.</div>
</body>
</html>
